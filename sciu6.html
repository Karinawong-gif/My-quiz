<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉伊卡哇除草檢定挑戰 - 能源與電</title>
    <style>
        :root {
            --bg-image: url('chiikawa/chiikawa wallpeaper.avif');
            --container-bg: rgba(255, 255, 255, 0.5); /* 白色 50% 半透明 */
            --primary-pink: #FFC0CB; /* 選項底色：粉紅色 */
            --primary-pink-hover: #FFD1DC;
            --powder-blue: #B0E0E6; /* 答對：粉籃色 */
            --wrong-red: #FF8A8A; /* 答錯：紅色 */
            --text-dark: #444444;
            --btn-gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: var(--text-dark);
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;
        }

        .score-points {
            color: #FF69B4; 
        }

        .question-text {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .q-type-badge {
            background-color: #90CAF9;
            color: white;
            font-size: 10pt;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .option-btn {
            background-color: var(--primary-pink);
            color: #444;
            border: none;
            border-bottom: 5px solid #FFB2C1;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-pink-hover);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .option-btn.correct {
            background-color: var(--powder-blue) !important;
            border-bottom-color: #98D0D6 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-bottom-color: #E57373 !important;
        }

        .option-btn.selected {
            background-color: #FFD180; 
            border-bottom-color: #FFB74D;
        }

        .character-sprite {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 110px;
            height: 110px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
        }

        .feedback-container {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            font-size: 13pt;
            font-weight: bold;
            display: none;
            z-index: 2;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: center;
        }

        .feedback-success { color: #00897B; }
        .feedback-fail { color: #D32F2F; }

        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        .action-btn {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 50px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .submit-btn {
            background-color: #4DD0E1;
            border-bottom: 4px solid #26C6DA;
        }

        .next-btn {
            background-color: var(--btn-gray);
            border-bottom: 4px solid #555;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-title {
            font-size: 26pt;
            color: #FF69B4;
            margin-bottom: 25px;
        }

        .result-badge {
            font-size: 22pt;
            font-weight: bold;
            color: #5C6BC0;
            margin-top: 15px;
            margin-bottom: 35px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #FFC0CB;
        }

        .restart-btn {
            background-color: #90CAF9;
            border-bottom: 5px solid #64B5F6;
            border-radius: 12px;
            padding: 14px 40px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quizSection" style="display: block; width: 100%;">
            <div class="score-header">
                <span id="progressText">第 1 / 10 題</span>
                <span class="score-points" id="scoreText">目前積分：0 / 10</span>
            </div>

            <div class="question-text">
                <span class="q-type-badge" id="typeBadge">單選題</span><span id="questionText">載入中...</span>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback-container" id="feedbackContainer"></div>

            <div class="control-panel">
                <button class="action-btn submit-btn" id="submitBtn" onclick="submitMultipleChoice()" style="display: none;">確認提交 ✔</button>
                <button class="action-btn next-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
            </div>
            
            <img src="chiikawa/chiikawa (2).png" alt="Character" class="character-sprite" id="charSprite">
        </div>

        <div id="resultSection" class="result-screen">
            <div class="result-title">🍃 除草檢定挑戰結束 🍃</div>
            <div style="font-size: 18pt; margin-bottom: 10px;">總得分：<span id="finalScoreText">0</span> / 10</div>
            <div style="font-size: 13pt; color: #666;">恭喜獲得：</div>
            <div class="result-badge" id="badgeText">3 級除草證</div>
            <button class="restart-btn" onclick="restartGame()">重新挑戰 ↺</button>
        </div>
    </div>

    <audio id="sndCorrect" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/cartoon_wink.ogg" type="audio/ogg"></audio>
    <audio id="sndWrong" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg" type="audio/ogg"></audio>

    <script>
        const fullQuestionPool = [
            { question: "以下哪些能源埋藏在地下或海底？（答案可多於一個。）", options: ["A. 煤。", "B. 石油。", "C. 太陽能。", "D. 天然氣。"], answer: [0, 1, 3], isMultiple: true, robloxId: 1 },
            { question: "石油可以用來生產或提煉甚麼？（答案可多於一個。）", options: ["A. 煤。", "B. 柴油。", "C. 汽油。", "D. 石油氣。"], answer: [1, 2, 3], isMultiple: true, robloxId: 2 },
            { question: "以下哪些是不可再生能源？（答案可多於一個。）", options: ["A. 太陽能。", "B. 煤。", "C. 石油。", "D. 天然氣。"], answer: [1, 2, 3], isMultiple: true, robloxId: 3 },
            { question: "以下哪種是可再生能源？", options: ["A. 水力能。", "B. 煤。", "C. 石油。", "D. 天然氣。"], answer: 0, isMultiple: false, robloxId: 4 },
            { question: "以下哪項不是可再生能源？", options: ["A. 煤。", "B. 水力能。", "C. 風能。", "D. 太陽能。"], answer: 0, isMultiple: false, robloxId: 5 },
            { question: "以下哪種是會耗盡的能源？", options: ["A. 煤。", "B. 太陽能。", "C. 風能。", "D. 水力能。"], answer: 0, isMultiple: false, robloxId: 6 },
            { question: "港鐵列車使用哪種能源來推動？", options: ["A. 汽油。", "B. 電。", "C. 石油氣。", "D. 柴油。"], answer: 1, isMultiple: false, robloxId: 7 },
            { question: "課室裏的投影機和電腦利用哪種能源來推動？", options: ["A. 汽油。", "B. 電。", "C. 石油氣。", "D. 柴油。"], answer: 1, isMultiple: false, robloxId: 8 },
            { question: "經常浪費能源會帶來哪些後果？（答案可多於一個。）", options: ["A. 耗盡太陽能。", "B. 減慢地球增温。", "C. 加速能源的消耗。", "D. 造成污染。"], answer: [2, 3], isMultiple: true, robloxId: 9 },
            { question: "以下哪些是浪費能源的行為？（答案可多於一個。）", options: ["A. 利用自然風乾衣。", "B. 取出飲品後，沒有把雪櫃門關好。", "C. 關掉不看的電視機。", "D. 把冷氣機的温度調至極低。"], answer: [1, 4], isMultiple: true, robloxId: 10 },
            { question: "以下哪些是節約能源的做法？（答案可多於一個。）", options: ["A. 利用天然光，減少使用電燈。", "B. 以電風扇取代冷氣機。", "C. 出門前關掉不使用的電器。", "D. 在夏天一邊使用冷氣機，一邊吃火鍋。"], answer: [0, 1, 2], isMultiple: true, robloxId: 1 },
            { question: "用電線把燈泡和乾電池正確地連接，組成的電路稱作甚麼？", options: ["A. 開合電路。", "B. 閉合電路。", "C. 短路。", "D. 開關電路。"], answer: 1, isMultiple: false, robloxId: 2 },
            { question: "乾電池的兩端分別稱作甚麼？", options: ["A. 「正向」和「反向」。", "B. 「正極」和「負極」。", "C. 「南極」和「北極」。", "D. 「正面」和「負面」。"], answer: 1, isMultiple: false, robloxId: 3 },
            { question: "以下哪項是對閉合電路的正確描述？", options: ["A. 只有乾電池的電路。", "B. 只有燈泡的電路。", "C. 能讓電通過的電路。", "D. 中斷的電路。"], answer: 2, isMultiple: false, robloxId: 4 },
            { question: "當電通過連接了燈泡的閉合電路時，會發生甚麼情況？", options: ["A. 燈泡會亮起來。", "B. 燈泡沒有亮起。", "C. 電路中斷。", "D. 光能轉換成電能。"], answer: 0, isMultiple: false, robloxId: 5 },
            { question: "乾電池有甚麼功用？", options: ["A. 照明。", "B. 提供電源。", "C. 作為開關。", "D. 連接燈泡和電線。"], answer: 1, isMultiple: false, robloxId: 6 },
            { question: "在電路中，開關有甚麼作用？", options: ["A. 提供電源。", "B. 連接和中斷電路。", "C. 連接燈泡和乾電池。", "D. 把電能轉換成光能。"], answer: 1, isMultiple: false, robloxId: 7 },
            { question: "電路中用作控制電器啟動或關閉的裝置稱作甚麼？", options: ["A. 插頭。", "B. 電線。", "C. 開關。", "D. 乾電池。"], answer: 2, isMultiple: false, robloxId: 8 },
            { question: "以下哪組屬於閉合電路？", options: ["A. 用電線把燈泡連接乾電池的正極和負極。", "B. 只用電線把燈泡連接乾電池的正極。", "C. 只用電線把燈泡連接乾電池的負極。", "D. 把電線 and 燈泡並列擺放。"], answer: 0, isMultiple: false, robloxId: 9 }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswers = [];

        function initGame() {
            // 從 19 題庫中隨機抽選 10 題出來考試
            const shuffled = [...fullQuestionPool].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById("quizSection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            selectedAnswers = [];
            document.getElementById("feedbackContainer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            const qData = currentQuestions[currentQuestionIndex];
            
            document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / 10 題`;
            document.getElementById("scoreText").innerText = `目前積分：${score} / 10`;
            document.getElementById("questionText").innerText = qData.question;
            
            const typeBadge = document.getElementById("typeBadge");
            if(qData.isMultiple) {
                typeBadge.innerText = "複選題";
                typeBadge.style.backgroundColor = "#F06292";
                document.getElementById("submitBtn").style.display = "block";
            } else {
                typeBadge.innerText = "單選題";
                typeBadge.style.backgroundColor = "#90CAF9";
            }

            const imgIndex = qData.robloxId || 2;
            document.getElementById("charSprite").src = `chiikawa/chiikawa (${imgIndex}).png`;

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            qData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            const qData = currentQuestions[currentQuestionIndex];
            
            if (!qData.isMultiple) {
                checkSingleAnswer(index);
            } else {
                if (selectedAnswers.includes(index)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    btnElement.classList.remove("selected");
                } else {
                    selectedAnswers.push(index);
                    btnElement.classList.add("selected");
                }
            }
        }

        function checkSingleAnswer(selectedIndex) {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            if (selectedIndex === qData.answer) {
                score++;
                buttons[selectedIndex].classList.add("correct");
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "太棒了！答對了！✨";
                playAudio("sndCorrect");
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[qData.answer].classList.add("correct");
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#E91E63;">${qData.options[qData.answer]}</span>`;
                playAudio("sndWrong");
            }
            document.getElementById("scoreText").innerText = `目前積分：${score} / 10`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function submitMultipleChoice() {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            
            if(selectedAnswers.length === 0) {
                alert("請至少選擇一個選項再提交！");
                return;
            }

            document.getElementById("submitBtn").style.display = "none";
            buttons.forEach(btn => btn.disabled = true);

            selectedAnswers.sort((a, b) => a - b);
            const correctAnswers = [...qData.answer].sort((a, b) => a - b);
            const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

            buttons.forEach((btn, idx) => {
                btn.classList.remove("selected");
                if (correctAnswers.includes(idx)) {
                    btn.classList.add("correct");
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add("wrong");
                }
            });

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            const correctTexts = correctAnswers.map(idx => qData.options[idx]).join("<br>");

            if (isCorrect) {
                score++;
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "太棒了！答對了！✨";
                playAudio("sndCorrect");
            } else {
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#E91E63; font-size:12pt;">${correctTexts}</span>`;
                playAudio("sndWrong");
            }

            document.getElementById("scoreText").innerText = `目前積分：${score} / 10`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("resultSection").style.display = "flex";
            document.getElementById("finalScoreText").innerText = score;

            let badge = "";
            if (score === 10) {
                badge = "超級打工者資格證";
            } else if (score >= 7) {
                badge = "擁有 5 級除草證";
            } else {
                badge = "擁有 3 級除草證";
            }
            
            document.getElementById("badgeText").innerText = badge;
        }

        function restartGame() { initGame(); }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音效播不出:", e));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
