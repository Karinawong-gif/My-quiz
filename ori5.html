<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢歷史大挑戰</title>
    <style>
        :root {
            --bg-image: url('https://images7.alphacoders.com/592/thumb-1920-592678.jpg');
            --glass-bg: rgba(255, 255, 255, 0.75);
            --correct-color: #4CAF50;
            --wrong-color: #f44336;
            --pokeball-red: #f00000;
            --pokeball-white: #ffffff;
            --pokeball-black: #222222;
        }

        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 題目容器 - 毛玻璃效果 */
        #game-container {
            width: 90%;
            max-width: 700px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        h2, h3, #score-display {
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8), 0 0 5px rgba(0,0,0,0.1);
            color: #333;
            margin-top: 0;
        }

        #score-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 15px;
        }

        #question-text {
            font-size: 1.3rem;
            line-height: 1.5;
            margin-bottom: 20px;
            z-index: 2;
        }

        /* 精靈球按鈕設計 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            z-index: 2;
        }

        .option-btn {
            position: relative;
            padding: 12px 20px;
            border: 3px solid var(--pokeball-black);
            border-radius: 50px;
            background: linear-gradient(to bottom, var(--pokeball-red) 45%, var(--pokeball-black) 45%, var(--pokeball-black) 55%, var(--pokeball-white) 55%);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: left;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 覆蓋層讓文字清晰 */
        .option-btn span {
            background: rgba(255, 255, 255, 0.85);
            padding: 2px 12px;
            border-radius: 20px;
            width: 100%;
            border: 1px solid #ccc;
        }

        .option-btn.correct { background: var(--correct-color); color: white; }
        .option-btn.wrong { background: var(--wrong-color); color: white; }
        .option-btn.correct span, .option-btn.wrong span { background: transparent; border: none; }

        /* 動態寶可夢圖片 */
        #pokemon-img {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
        }

        /* 回饋與下一題 */
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 1.5em;
        }

        #next-btn {
            display: none;
            margin: 20px auto 0;
            width: 80px;
            height: 80px;
            background-color: var(--pokeball-red);
            color: white;
            border: 4px solid var(--pokeball-black);
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        #next-btn:hover { transform: rotate(15deg) scale(1.1); }

        /* 結算頁面 */
        #result-screen {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .rank { font-size: 2rem; color: #e65100; margin-top: 10px; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="quiz-screen">
            <div id="score-display">當前得分：0 / 10</div>
            <div id="question-text">載入題目中...</div>
            <div class="options-grid" id="options-container">
                </div>
            <div id="feedback"></div>
            <button id="next-btn">下一題</button>
            <img id="pokemon-img" src="" alt="pokemon">
        </div>

        <div id="result-screen">
            <h2>遊戲結束！</h2>
            <h1 id="final-score">得分：0 / 10</h1>
            <div class="rank" id="rank-text">稱號：新手訓練家</div>
            <button onclick="location.reload()" style="margin-top:30px; padding:10px 20px; cursor:pointer;">重新挑戰</button>
        </div>
    </div>

    <audio id="snd-correct" src=""></audio>
    <audio id="snd-wrong" src=""></audio>

    <script>
        const allQuestions = [
            { q: "以下哪項對於唐朝盛世的描述是不正確的？", o: ["國家經濟富裕", "與其他國家貿易往來頻繁", "擁有橫跨歐洲和亞洲的領土", "得到鄰近地區和其他民族的尊崇"], a: 2, id: 25 }, // Pikachu
            { q: "以下哪項對於唐朝的描述是不正確的？", o: ["國家經濟富裕", "距離現代超過一千年", "與其他國家往來頻繁", "派遣大量留學生前往日本、朝鮮半島等地"], a: 3, id: 6 }, // Charizard
            { q: "以下哪項對於唐太宗的描述是不正確的？", o: ["鄰近地區奉他為領袖", "他正式宣佈廣州為貿易通商口岸", "唐朝在他統治的時候是「盛世」", "他採取了幫助人民謀生的措施"], a: 1, id: 1 }, // Bulbasaur
            { q: "以下哪個地方是唐朝的首都？", o: ["建康", "長安", "汴京", "臨安"], a: 1, id: 4 }, // Charmander
            { q: "遣唐使是以下哪個國家或地區派遣到唐朝的官方使節？", o: ["日本", "天竺", "阿拉伯", "朝鮮半島"], a: 0, id: 7 }, // Squirtle
            { q: "香港哪個地方在國家唐朝時期是海上交通重鎮？", o: ["荃灣", "中環", "屯門", "九龍城"], a: 2, id: 54 }, // Psyduck
            { q: "為甚麼唐朝設置屯門鎮並派兵駐守？", o: ["保護商船", "保護唐太宗", "護送漁船到廣州", "禁止外來漁船出海捕魚"], a: 0, id: 131 }, // Lapras
            { q: "歷史上的天竺是現在的哪個國家？", o: ["越南", "印尼", "印度", "泰國"], a: 2, id: 64 }, // Kadabra
            { q: "天竺是以下哪個宗教的發源地？", o: ["道教", "佛教", "天主教", "基督教"], a: 1, id: 63 }, // Abra
            { q: "以下哪些對於玄奘去天竺的描述是正確的？", o: ["唐太宗指派前往", "回國後親自寫書", "為修正翻譯錯漏前往", "被尊稱為「三藏法師」"], a: [2, 3], multi: true, id: 65 },
            { q: "以下哪項對玄奘的描述是不正確的？", o: ["在天竺逗留了15年", "尊稱「三藏法師」", "翻譯佛經成漢文", "親手將西行見聞編寫成書"], a: 3, id: 150 }, // Mewtwo
            { q: "玄奘為中印文化交流作出了哪些貢獻？", o: ["翻譯漢文佛經", "編寫小說西遊記", "西行見聞口述成書", "傳入中國經典至印度"], a: [0, 2, 3], multi: true, id: 151 }, 
            { q: "以下哪些事物是從印度傳入中國的？", o: ["茶葉", "絲綢", "製糖術", "造像藝術"], a: [2, 3], multi: true, id: 122 }, // Mr. Mime
            { q: "鑒真曾經前往哪個國家傳揚佛教？", o: ["日本", "韓國", "蒙古", "天竺"], a: 0, id: 52 }, // Meowth
            { q: "以下哪項對鑒真的描述是不正確的？", o: ["唐朝高僧", "在日本逗留了十九年", "在日本推廣書法", "教導日本人中草藥知識"], a: 1, id: 39 }, // Jigglypuff
            { q: "以下哪些是鑒真在日本的重要事跡？", o: ["傳揚佛教", "推廣中國書法", "尊稱三藏法師", "教導中草藥知識"], a: [0, 1, 3], multi: true, id: 40 },
            { q: "以下哪座城市是宋朝的首都？", o: ["長安", "汴京", "洛陽", "大都"], a: 1, id: 143 }, // Snorlax
            { q: "汴京是現今哪個城市？", o: ["西安", "洛陽", "開封", "北京"], a: 2, id: 133 }, // Eevee
            { q: "以下哪些關於《清明上河圖》的描述是正確的？", o: ["木橋稱為虹橋", "描繪汴京及汴河景象", "反映市集冷清", "無描繪人活動"], a: [0, 1], multi: true, id: 149 }, // Dragonite
            { q: "以下哪項對於「水密隔艙」技術的描述是正確的？", o: ["更加美觀", "不易起火", "不易沉沒", "更快航行"], a: 2, id: 9 }, // Blastoise
            { q: "以下哪個地方是宋朝時期香料的原產地和集散地？", o: ["東南亞", "九龍城", "汴京", "歐洲"], a: 0, id: 45 }, // Vileplume
            { q: "「宋王臺」石碑紀念了哪段歷史？", o: ["祭祀祖先", "打勝仗", "登基", "逃難至九龍城"], a: 3, id: 144 }, // Articuno
            { q: "以下哪項不是出土自宋皇臺港鐵站的文物？", o: ["茶具", "香爐", "佛經", "全國流通貨幣"], a: 2, id: 145 }, // Zapdos
            { q: "宋朝從內地遷移至香港五大宗族中，哪個姓氏最早？", o: ["文", "鄧", "廖", "彭"], a: 1, id: 146 }, // Moltres
            { q: "宋朝時，為甚麼人們從內地遷徙至新界建立圍村？", o: ["逃避重稅", "逃避水災", "逃避戰火", "進行貿易"], a: 2, id: 59 }, // Arcanine
            { q: "以下哪項不是圍村的設施？", o: ["水井", "書室", "宗祠", "公園"], a: 3, id: 58 }, // Growlithe
            { q: "圍村的宗祠有甚麼用途？", o: ["供奉祖先", "防禦盜賊", "給子弟讀書", "討論重要事情"], a: [0, 3], multi: true, id: 37 }, // Vulpix
            { q: "以下哪項對宋朝的描述是不正確的？", o: ["距離現在兩千年", "經濟繁榮", "軍事疲弱", "造船發達"], a: 0, id: 38 }, // Ninetales
            { q: "以下哪些是文天祥的生平事跡？", o: ["抗元入侵", "發明水密隔艙", "繪畫清明上河圖", "拒絕元朝勸降"], a: [0, 3], multi: true, id: 130 }, // Gyarados
            { q: "以下哪項對於文天祥的描述是不正確的？", o: ["對抗蒙古入侵", "曾任丞相", "前往新界建立圍村", "寫下愛國詩句"], a: 2, id: 129 }, // Magikarp
            { q: "誰建立了蒙古政權？", o: ["文天祥", "忽必烈", "鐵木真", "鑒真"], a: 2, id: 123 }, // Scyther
            { q: "誰被尊稱為成吉思汗？", o: ["忽必烈", "文天祥", "鐵木真", "唐太宗"], a: 2, id: 124 }, // Jynx
            { q: "誰是元朝的開國皇帝？", o: ["玄奘", "忽必烈", "唐太宗", "成吉思汗"], a: 1, id: 125 }, // Electabuzz
            { q: "以下哪項對於蒙古族的描述是不正確的？", o: ["消滅了唐朝", "苦練騎術", "性格堅毅", "適應惡劣環境"], a: 0, id: 126 }, // Magmar
        ];

        let currentQuiz = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options-container');
        const scoreEl = document.getElementById('score-display');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const pokeImg = document.getElementById('pokemon-img');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        // 初始化遊戲
        function initGame() {
            currentQuiz = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
            currentIndex = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            nextBtn.style.display = 'none';
            feedbackEl.innerText = '';
            const data = currentQuiz[currentIndex];
            
            scoreEl.innerText = `當前得分：${score} / 10 (第 ${currentIndex + 1} 題)`;
            questionEl.innerText = data.q;
            if(data.multi) questionEl.innerText += " (多選題)";

            optionsEl.innerHTML = '';
            data.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${String.fromCharCode(65 + index)}. ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsEl.appendChild(btn);
            });

            // 更新寶可夢圖片
            pokeImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${data.id}.png`;
        }

        function checkAnswer(idx, btn) {
            if (answered) return;
            
            const data = currentQuiz[currentIndex];
            let isCorrect = false;

            // 處理單選與多選邏輯 (此處為簡化互動，多選題點選其中一個正確項即算部分回饋，或根據規格改為點擊後判定)
            const correctAnswers = Array.isArray(data.a) ? data.a : [data.a];
            
            if (correctAnswers.includes(idx)) {
                btn.classList.add('correct');
                feedbackEl.innerText = "答對了！";
                feedbackEl.style.color = "green";
                score++;
                document.getElementById('snd-correct').play().catch(()=>{});
            } else {
                btn.classList.add('wrong');
                const correctText = correctAnswers.map(i => String.fromCharCode(65+i)).join('、');
                feedbackEl.innerText = `答錯了，正確答案是：${correctText}`;
                feedbackEl.style.color = "red";
                document.getElementById('snd-wrong').play().catch(()=>{});
                
                // 顯示正確的那個按鈕
                const btns = optionsEl.getElementsByClassName('option-btn');
                correctAnswers.forEach(correctIdx => {
                    btns[correctIdx].classList.add('correct');
                });
            }

            answered = true;
            nextBtn.style.display = 'block';
            scoreEl.innerText = `當前得分：${score} / 10 (第 ${currentIndex + 1} 題)`;
        }

        nextBtn.onclick = () => {
            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            document.getElementById('final-score').innerText = `得分：${score} / 10`;
            
            let rank = "";
            if (score === 10) rank = "精靈大師";
            else if (score >= 7) rank = "資深訓練家";
            else rank = "新手訓練家";
            
            document.getElementById('rank-text').innerText = `稱號：${rank}`;
        }

        initGame();
    </script>
</body>
</html>
