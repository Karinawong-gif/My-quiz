<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Story 5 人際與玩具生活素養挑戰</title>
    <style>
        :root {
            /* 背景圖片預設路徑 */
            --bg-image: url('wallapaper.jpg');
            --container-bg: rgba(255, 255, 255, 0.75);
            --primary-yellow: #FFD54F;
            --primary-yellow-hover: #FFE082;
            --powder-blue: #81D4FA;
            --wrong-red: #FF8A8A;
            --text-dark: #333333;
            --btn-gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: var(--text-dark);
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;
        }

        .score-points {
            color: #D32F2F; 
        }

        .question-text {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .q-type-badge {
            background-color: #0288D1;
            color: white;
            font-size: 10pt;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .option-btn {
            background-color: var(--primary-yellow);
            color: #333;
            border: none;
            border-bottom: 5px solid #FFC107;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-yellow-hover);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .option-btn.correct {
            background-color: var(--powder-blue) !important;
            border-bottom-color: #29B6F6 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-bottom-color: #E57373 !important;
        }

        .option-btn.selected {
            background-color: #FFB74D; 
            border-bottom-color: #FFA726;
        }

        /* 右下角 Toy Story 角色圖片樣式 */
        .character-sprite {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 130px;
            height: 130px;
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
            opacity: 0.98;
        }

        .feedback-container {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 13pt;
            font-weight: bold;
            display: none;
            z-index: 3;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: center;
        }

        .feedback-success { color: #2E7D32; }
        .feedback-fail { color: #C62828; }

        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        .action-btn {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 50px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .submit-btn {
            background-color: #0288D1;
            border-bottom: 4px solid #0277BD;
        }

        .next-btn {
            background-color: var(--btn-gray);
            border-bottom: 4px solid #555;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-title {
            font-size: 24pt;
            color: #D32F2F;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .result-badge {
            font-size: 20pt;
            font-weight: bold;
            color: #1976D2;
            margin-top: 15px;
            margin-bottom: 35px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #FFD54F;
        }

        .restart-btn {
            background-color: #4CAF50;
            border-bottom: 5px solid #388E3C;
            border-radius: 12px;
            padding: 14px 40px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quizSection" style="display: block; width: 100%;">
            <div class="score-header">
                <span id="progressText">第 1 / 10 題</span>
                <span class="score-points" id="scoreText">目前積分：0 / 10</span>
            </div>

            <div class="question-text">
                <span class="q-type-badge" id="typeBadge">單選題</span><span id="questionText">載入中...</span>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback-container" id="feedbackContainer"></div>

            <div class="control-panel">
                <button class="action-btn submit-btn" id="submitBtn" onclick="submitMultipleChoice()" style="display: none;">確認提交 ✔</button>
                <button class="action-btn next-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
            </div>
            
            <!-- 右下角 Toy Story 角色圖片 -->
            <img src="" alt="Toy Story Character" class="character-sprite" id="charSprite">
        </div>

        <div id="resultSection" class="result-screen">
            <div class="result-title">🚀 Toy Story 5 人際與玩具挑戰結束 🚀</div>
            <div style="font-size: 18pt; margin-bottom: 10px;">總得分：<span id="finalScoreText">0</span> / <span id="totalPossibleText">10</span></div>
            <div style="font-size: 13pt; color: #666;">獲得榮譽稱號：</div>
            <div class="result-badge" id="badgeText">玩具好友守護者</div>
            <button class="restart-btn" onclick="restartGame()">重新挑戰 ↺</button>
        </div>
    </div>

    <audio id="sndCorrect" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/cartoon_wink.ogg" type="audio/ogg"></audio>
    <audio id="sndWrong" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg" type="audio/ogg"></audio>

    <script>
        const TARGET_QUESTIONS_PER_GAME = 10; // 修改為每局隨機 10 題
        let actualQuestionsPerGame = 10;
        
        // 可用的角色圖片索引列表（排除未包含的 9 號）
        const AVAILABLE_CHAR_IDS = [1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 12, 13];

        const fullQuestionPool = [
            { question: "為甚麼我們需要結交朋友？（答案可多於一個。）", options: ["A. 朋友是我們學習的好夥伴。", "B. 朋友是我們玩耍的好夥伴。", "C. 朋友照顧我們的生活。", "D. 朋友是我們吵架的夥伴。"], answer: [0, 1], isMultiple: true, charId: 1 },
            { question: "我們和朋友有不同的意見時，不應該怎樣做？", options: ["A. 和朋友一起商量解決的方法。", "B. 向朋友説出自己的看法。", "C. 聆聽朋友的説話。", "D. 不再理會朋友。"], answer: 3, isMultiple: false, charId: 2 },
            { question: "我們和朋友或家人發生紛爭時，應該怎樣做？", options: ["A. 立即離開。", "B. 堅持自己的看法。", "C. 和對方吵架。", "D. 心平氣和地溝通。"], answer: 3, isMultiple: false, charId: 3 },
            { question: "與朋友或家人發生紛爭時，應該怎樣做？", options: ["A. 大哭大叫。", "B. 不再理會對方。", "C. 只從自己的角度去思考。", "D. 聆聽對方的解釋。"], answer: 3, isMultiple: false, charId: 4 },
            { question: "以下哪項不是我國的傳統玩具？", options: ["A. 毽子。", "B. 電動玩具車。", "C. 泥娃娃。", "D. 陀螺。"], answer: 1, isMultiple: false, charId: 5 },
            { question: "以下哪些是我國的傳統玩具？（答案可多於一個。）", options: ["A. 遙控車。", "B. 蹴鞠。", "C. 智能機械人。", "D. 抓子。"], answer: [1, 3], isMultiple: true, charId: 6 },
            { question: "洋娃娃屬於甚麼種類的玩具？", options: ["A. 電子科技遊戲及玩具。", "B. 玩偶玩具。", "C. 益智玩具。", "D. 模擬類玩具。"], answer: 1, isMultiple: false, charId: 7 },
            { question: "以下哪項不是玩具的益處？", options: ["A. 強身健體。", "B. 訓練思考。", "C. 提供營養。", "D. 增加生活樂趣。"], answer: 2, isMultiple: false, charId: 8 },
            { question: "以下哪項是玩拼圖的益處？", options: ["A. 發揮創意。", "B. 訓練思考。", "C. 學習與人相處。", "D. 強身健體。"], answer: 1, isMultiple: false, charId: 10 },
            { question: "玩以下哪項玩具可以發揮創意？", options: ["A. 泥膠。", "B. 飛行棋。", "C. 電動車。", "D. 保齡球玩具。"], answer: 0, isMultiple: false, charId: 11 },
            { question: "玩以下哪項玩具可以訓練思考？", options: ["A. 飛行棋。", "B. 毽子。", "C. 滑板車。", "D. 洋娃娃。"], answer: 0, isMultiple: false, charId: 12 },
            { question: "以下哪個小朋友玩玩具的方法不會帶來危險？", options: ["A. 愛雲把弓箭玩具射向別人的臉。", "B. 家齊在桌上下棋。", "C. 大文把玩具槍的槍口對着自己或別人的眼睛。", "D. 明華在室內玩發射類玩具。"], answer: 1, isMultiple: false, charId: 13 },
            { question: "以下哪些是我們玩玩具時應該做的事情？", options: ["A. 使用沒有損壞的電池。", "B. 把臉部或嘴巴貼近絨毛玩具。", "C. 在室內玩發射類玩具。", "D. 把臉部湊近玩具槍或玩具弓箭。"], answer: 0, isMultiple: false, charId: 1 },
            { question: "如果玩具損壞了，我們應該怎樣做？", options: ["A. 立即棄掉玩具。", "B. 把玩具藏起來，避免受責罵。", "C. 重新購買一個相同的玩具。", "D. 告訴家人，請家人幫忙修理玩具。"], answer: 3, isMultiple: false, charId: 2 },
            { question: "我們應該怎樣處理自己不想再玩而沒有損壞的玩具？（答案可多於一個。）", options: ["A. 立即丟進垃圾箱。", "B. 捐給慈善機構。", "C. 送給別人。", "D. 把玩具收藏起來，留待以後再玩。"], answer: [1, 2, 3], isMultiple: true, charId: 3 },
            { question: "以下哪些是愛惜玩具的行為？（答案可多於一個。）", options: ["A. 隨處擺放玩具。", "B. 收拾玩具。", "C. 時常清潔玩具。", "D. 丟掉玩厭的玩具。"], answer: [1, 2], isMultiple: true, charId: 4 },
            { question: "以下哪項描述是不正確的？", options: ["A. 每個人都是獨特的。", "B. 每個人都是一樣的。", "C. 我們要瞭解自己和朋友。", "D. 我們要欣賞每個人獨特的地方。"], answer: 1, isMultiple: false, charId: 5 },
            { question: "與家人或朋友發生紛爭時，我們應該以怎樣的態度解決紛爭？（答案可多於一個。）", options: ["A. 冷靜。", "B. 心平氣和。", "C. 生氣。", "D. 激動。"], answer: [0, 1], isMultiple: true, charId: 6 },
            { question: "和家人或朋友發生紛爭時應該怎樣解決？（答案可多於一個。）", options: ["A. 大聲地指責對方。", "B. 不再跟對方説話。", "C. 一起商量解決的方法。", "D. 聆聽對方的解釋。"], answer: [2, 3], isMultiple: true, charId: 7 },
            { question: "如果朋友沒信心，説話時聲音太小，我們可以怎樣包容朋友？", options: ["A. 取笑他。", "B. 責罵他。", "C. 耐心地聆聽他説話。", "D. 不跟他説話。"], answer: 2, isMultiple: false, charId: 8 },
            { question: "以下哪項是尊重朋友的行為？", options: ["A. 接受朋友和自己不同的地方。", "B. 要求朋友跟自己做相同的事情。", "C. 不准朋友説出他的想法。", "D. 取笑朋友的喜好。"], answer: 0, isMultiple: false, charId: 10 },
            { question: "以下哪項是和朋友相處的正確態度？", options: ["A. 尊重和包容朋友。", "B. 不理會朋友的感受。", "C. 取笑朋友。", "D. 生氣時向朋友發脾氣。"], answer: 0, isMultiple: false, charId: 11 },
            { question: "以下哪項不是與家人或朋友和諧共處的態度？", options: ["A. 互相關心。", "B. 互相幫助。", "C. 互相取笑。", "D. 互相尊重。"], answer: 2, isMultiple: false, charId: 12 },
            { question: "朋友之間應該怎樣相處？（答案可多於一個。）", options: ["A. 互相責罵。", "B. 互相取笑。", "C. 互相關心。", "D. 互相幫助。"], answer: [2, 3], isMultiple: true, charId: 13 },
            { question: "以下哪項是與朋友和諧共處的表現？", options: ["A. 嘲笑朋友的興趣。", "B. 聆聽朋友的想法。", "C. 與朋友大聲吵架。", "D. 取笑朋友的外貌特徵。"], answer: 1, isMultiple: false, charId: 1 },
            { question: "以下哪項是包容朋友的行為？", options: ["A. 取笑朋友的性格。", "B. 強迫朋友改變。", "C. 接受朋友做得不夠好的地方。", "D. 不接受朋友的喜好和感受。"], answer: 2, isMultiple: false, charId: 2 },
            { question: "朋友遇到煩惱時，我們應該怎樣做？（答案可多於一個。）", options: ["A. 幫助朋友。", "B. 關心朋友。", "C. 讓朋友自己解決問題。", "D. 取笑朋友。"], answer: [0, 1], isMultiple: true, charId: 3 },
            { question: "以下哪項是選擇玩具的正確態度？", options: ["A. 看到最新的玩具，便立刻購買。", "B. 考慮玩具是否適合自己的年齡和喜好。", "C. 完全不考慮玩具的價錢。", "D. 看到朋友有的玩具，自己也要購買。"], answer: 1, isMultiple: false, charId: 4 }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswers = [];

        // 初始化背景圖片相容性機制
        function initBackground() {
            const bgCandidates = [
                'wallapaper.jpg',
                'Toystory/wallapaper.jpg',
                'file:///C:/Users/annsk/OneDrive/桌面/MC%20games/Toystory/wallapaper.jpg',
                'wallapaper.png',
                'Toystory/wallapaper.png'
            ];
            
            let bgImg = new Image();
            let candidateIdx = 0;

            function tryNextBg() {
                if (candidateIdx >= bgCandidates.length) return;
                let src = bgCandidates[candidateIdx];
                bgImg.onload = function() {
                    document.body.style.backgroundImage = `url('${src}')`;
                };
                bgImg.onerror = function() {
                    candidateIdx++;
                    tryNextBg();
                };
                bgImg.src = src;
            }
            tryNextBg();
        }

        function initGame() {
            initBackground();
            const shuffled = [...fullQuestionPool].sort(() => 0.5 - Math.random());
            actualQuestionsPerGame = Math.min(TARGET_QUESTIONS_PER_GAME, fullQuestionPool.length);
            currentQuestions = shuffled.slice(0, actualQuestionsPerGame);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById("quizSection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            selectedAnswers = [];
            document.getElementById("feedbackContainer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            const qData = currentQuestions[currentQuestionIndex];
            
            document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / ${actualQuestionsPerGame} 題`;
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("questionText").innerText = qData.question;
            
            const typeBadge = document.getElementById("typeBadge");
            if(qData.isMultiple) {
                typeBadge.innerText = "複選題";
                typeBadge.style.backgroundColor = "#E65100";
                document.getElementById("submitBtn").style.display = "block";
            } else {
                typeBadge.innerText = "單選題";
                typeBadge.style.backgroundColor = "#0288D1";
            }

            // 加載角色圖片，包含完整的降級相容機制
            loadCharacterImage(qData.charId || 1);

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            qData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        // 載入角色圖片的多級降級相容機制
        function loadCharacterImage(charId) {
            const charSprite = document.getElementById("charSprite");
            
            // 檔名候選列表 (完全匹配資料夾: Toy Story (N).png 及絕對路徑)
            const sources = [
                `Toy Story (${charId}).png`,
                `Toystory/Toy Story (${charId}).png`,
                `file:///C:/Users/annsk/OneDrive/桌面/MC%20games/Toystory/Toy%20Story%20(${charId}).png`,
                `Toy Story (${charId}).jpg`,
                `Toystory/Toy Story (${charId}).jpg`
            ];

            let sourceIdx = 0;

            function tryLoadNext() {
                if (sourceIdx >= sources.length) {
                    charSprite.style.display = 'none';
                    return;
                }
                charSprite.style.display = 'block';
                charSprite.onerror = function() {
                    sourceIdx++;
                    tryLoadNext();
                };
                charSprite.src = sources[sourceIdx];
            }

            tryLoadNext();
        }

        function selectOption(index, btnElement) {
            const qData = currentQuestions[currentQuestionIndex];
            
            if (!qData.isMultiple) {
                checkSingleAnswer(index);
            } else {
                if (selectedAnswers.includes(index)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    btnElement.classList.remove("selected");
                } else {
                    selectedAnswers.push(index);
                    btnElement.classList.add("selected");
                }
            }
        }

        function checkSingleAnswer(selectedIndex) {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            if (selectedIndex === qData.answer) {
                score++;
                buttons[selectedIndex].classList.add("correct");
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "飛向宇宙，浩瀚無垠！答對了！✨";
                playAudio("sndCorrect");
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[qData.answer].classList.add("correct");
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#D32F2F;">${qData.options[qData.answer]}</span>`;
                playAudio("sndWrong");
            }
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function submitMultipleChoice() {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            
            if(selectedAnswers.length === 0) {
                alert("請至少選擇一個選項再提交！");
                return;
            }

            document.getElementById("submitBtn").style.display = "none";
            buttons.forEach(btn => btn.disabled = true);

            selectedAnswers.sort((a, b) => a - b);
            const correctAnswers = [...qData.answer].sort((a, b) => a - b);
            const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

            buttons.forEach((btn, idx) => {
                btn.classList.remove("selected");
                if (correctAnswers.includes(idx)) {
                    btn.classList.add("correct");
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add("wrong");
                }
            });

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            const correctTexts = correctAnswers.map(idx => qData.options[idx]).join("<br>");

            if (isCorrect) {
                score++;
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "飛向宇宙，浩瀚無垠！答對了！✨";
                playAudio("sndCorrect");
            } else {
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#D32F2F; font-size:12pt;">${correctTexts}</span>`;
                playAudio("sndWrong");
            }

            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < actualQuestionsPerGame) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("resultSection").style.display = "flex";
            document.getElementById("finalScoreText").innerText = score;
            document.getElementById("totalPossibleText").innerText = actualQuestionsPerGame;

            let badge = "";
            let passRatio = score / actualQuestionsPerGame;
            if (passRatio === 1) {
                badge = "胡迪級玩具好友大師 (Woody)";
            } else if (passRatio >= 0.7) {
                badge = "巴斯光年友誼特攻";
            } else {
                badge = "玩具總動員新成員";
            }
            
            document.getElementById("badgeText").innerText = badge;
        }

        function restartGame() { initGame(); }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音效播不出:", e));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
