            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);

            border: 3px solid #E52521; /* Mario Red Border */
            border-radius: 25px;
            width: 100%;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;

        .score-points {
            color: #E52521;

            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 5;
        }

            border: none;
            border-bottom: 5px solid #F39C12;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-yellow-hover);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .option-btn.correct {
            background-color: var(--powder-blue) !important;
            border-bottom-color: #29B6F6 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-bottom-color: #E57373 !important;
        }

        .option-btn.selected {
            background-color: #FFB74D; 
            border-bottom-color: #FFA726;
        }

            bottom: 15px;
            right: 15px;
            width: 130px;
            height: 130px;
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
            opacity: 0.98;
        }

            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 13pt;
            font-weight: bold;
            display: none;
            z-index: 3;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: center;
        }

            justify-content: center;
            align-items: center;
            margin-top: 5px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

            padding: 14px 50px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;

            background-color: #E52521;
            border-bottom: 4px solid #B71C1C;
        }

        .next-btn {
            background-color: var(--btn-gray);
            border-bottom: 4px solid #555;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-title {

            border-radius: 12px;
            padding: 14px 40px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

</head>

            const bgCandidates = [
                'wallpaper.jpg',
                'wallpaper.png',
                'Mario/wallpaper.jpg',
                'Mario/wallpaper.png',
                'file:///C:/Users/annsk/OneDrive/桌面/MC%20games/Mario/wallpaper.jpg',
                'file:///C:/Users/annsk/OneDrive/桌面/MC%20games/Mario/wallpaper.png'
            ];
            
            let bgImg = new Image();
            let candidateIdx = 0;

            function tryNextBg() {
                if (candidateIdx >= bgCandidates.length) return;
                let src = bgCandidates[candidateIdx];
                bgImg.onload = function() {
                    document.body.style.backgroundImage = `url('${src}')`;
                };
                bgImg.onerror = function() {
                    candidateIdx++;
                    tryNextBg();
                };
                bgImg.src = src;
            }
            tryNextBg();
        }

        function initGame() {
            initBackground();
            const shuffled = [...fullQuestionPool].sort(() => 0.5 - Math.random());
            actualQuestionsPerGame = Math.min(TARGET_QUESTIONS_PER_GAME, fullQuestionPool.length);
            currentQuestions = shuffled.slice(0, actualQuestionsPerGame);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById("quizSection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            selectedAnswers = [];
            document.getElementById("feedbackContainer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            const qData = currentQuestions[currentQuestionIndex];
            
            document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / ${actualQuestionsPerGame} 題`;
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("questionText").innerText = qData.question;
            
            const typeBadge = document.getElementById("typeBadge");
            if(qData.isMultiple) {
                typeBadge.innerText = "複選題";
                typeBadge.style.backgroundColor = "#E65100";
                document.getElementById("submitBtn").style.display = "block";
            } else {
                typeBadge.innerText = "單選題";
                typeBadge.style.backgroundColor = "#009922";
            }

            // 加載 MARIO 角色圖片
            loadCharacterImage(qData.charId || 1);

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            qData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        // 載入 Mario 角色圖片的多級降級相容機制
        function loadCharacterImage(charId) {
            const charSprite = document.getElementById("charSprite");
            
            const sources = [
                `Mario (${charId}).png`,
                `Mario/Mario (${charId}).png`,
                `file:///C:/Users/annsk/OneDrive/桌面/MC%20games/Mario/Mario%20(${charId}).png`,
                `Mario (${charId}).jpg`,
                `Mario/Mario (${charId}).jpg`
            ];

            let sourceIdx = 0;

            function tryLoadNext() {
                if (sourceIdx >= sources.length) {
                    charSprite.style.display = 'none';
                    return;
                }
                charSprite.style.display = 'block';
                charSprite.onerror = function() {
                    sourceIdx++;
                    tryLoadNext();
                };
                charSprite.src = sources[sourceIdx];
            }

            tryLoadNext();
        }

        function selectOption(index, btnElement) {
            const qData = currentQuestions[currentQuestionIndex];
            
            if (!qData.isMultiple) {
                checkSingleAnswer(index);
            } else {
                if (selectedAnswers.includes(index)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    btnElement.classList.remove("selected");
                } else {
                    selectedAnswers.push(index);
                    btnElement.classList.add("selected");
                }
            }
        }

        function checkSingleAnswer(selectedIndex) {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            if (selectedIndex === qData.answer) {
                score++;
                buttons[selectedIndex].classList.add("correct");
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "Here we go! 答對了！🍄⭐";
                playAudio("sndCorrect");
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[qData.answer].classList.add("correct");
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `Mamma mia! 答錯了，正確答案是：<br><span style="color:#D32F2F;">${qData.options[qData.answer]}</span>`;
                playAudio("sndWrong");
            }
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function submitMultipleChoice() {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            
            if(selectedAnswers.length === 0) {
                alert("請至少選擇一個選項再提交！");
                return;
            }

            document.getElementById("submitBtn").style.display = "none";
            buttons.forEach(btn => btn.disabled = true);

            selectedAnswers.sort((a, b) => a - b);
            const correctAnswers = [...qData.answer].sort((a, b) => a - b);
            const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

            buttons.forEach((btn, idx) => {
                btn.classList.remove("selected");
                if (correctAnswers.includes(idx)) {
                    btn.classList.add("correct");
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add("wrong");
                }
            });

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            const correctTexts = correctAnswers.map(idx => qData.options[idx]).join("<br>");

            if (isCorrect) {
                score++;
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "Here we go! 答對了！🍄⭐";
                playAudio("sndCorrect");
            } else {
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `Mamma mia! 答錯了，正確答案是：<br><span style="color:#D32F2F; font-size:12pt;">${correctTexts}</span>`;
                playAudio("sndWrong");
            }

            document.getElementById("scoreText").innerText = `目前積分：${score} / ${actualQuestionsPerGame}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < actualQuestionsPerGame) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("resultSection").style.display = "flex";
            document.getElementById("finalScoreText").innerText = score;
            document.getElementById("totalPossibleText").innerText = actualQuestionsPerGame;

            let badge = "";
            let passRatio = score / actualQuestionsPerGame;
            if (passRatio === 1) {
                badge = "瑪利歐級遠足達人 (Mario Master)";
            } else if (passRatio >= 0.7) {
                badge = "路易吉安全巡邏員 (Luigi Ally)";
            } else {
                badge = "蘑菇王國新星冒險家";
            }
            
            document.getElementById("badgeText").innerText = badge;
        }

        function restartGame() { initGame(); }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音效播不出:", e));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
