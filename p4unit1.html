<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out 腦筋急轉彎香港地理與氣候挑戰</title>
    <style>
        :root {
            /* 背景圖片路徑 */
            --bg-image: url('inside out/insideout wallpaper.jpg');
            --container-bg: rgba(255, 255, 255, 0.55);
            --primary-pink: #FFC0CB;
            --primary-pink-hover: #FFD1DC;
            --powder-blue: #B0E0E6;
            --wrong-red: #FF8A8A;
            --text-dark: #444444;
            --btn-gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            color: var(--text-dark);
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;
        }

        .score-points {
            color: #E91E63; 
        }

        .question-text {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .q-type-badge {
            background-color: #90CAF9;
            color: white;
            font-size: 10pt;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .option-btn {
            background-color: var(--primary-pink);
            color: #444;
            border: none;
            border-bottom: 5px solid #FFB2C1;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-pink-hover);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .option-btn.correct {
            background-color: var(--powder-blue) !important;
            border-bottom-color: #98D0D6 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-bottom-color: #E57373 !important;
        }

        .option-btn.selected {
            background-color: #FFD180; 
            border-bottom-color: #FFB74D;
        }

        /* 右下角 Inside Out 角色圖片樣式 */
        .character-sprite {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 130px;
            height: 130px;
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
            opacity: 0.98;
        }

        .feedback-container {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            font-size: 13pt;
            font-weight: bold;
            display: none;
            z-index: 3;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: center;
        }

        .feedback-success { color: #00897B; }
        .feedback-fail { color: #D32F2F; }

        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        .action-btn {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 50px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .submit-btn {
            background-color: #4DD0E1;
            border-bottom: 4px solid #26C6DA;
        }

        .next-btn {
            background-color: var(--btn-gray);
            border-bottom: 4px solid #555;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-title {
            font-size: 26pt;
            color: #E91E63;
            margin-bottom: 25px;
        }

        .result-badge {
            font-size: 22pt;
            font-weight: bold;
            color: #3F51B5;
            margin-top: 15px;
            margin-bottom: 35px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #FFC0CB;
        }

        .restart-btn {
            background-color: #90CAF9;
            border-bottom: 5px solid #64B5F6;
            border-radius: 12px;
            padding: 14px 40px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quizSection" style="display: block; width: 100%;">
            <div class="score-header">
                <span id="progressText">第 1 / 10 題</span>
                <span class="score-points" id="scoreText">目前積分：0 / 10</span>
            </div>

            <div class="question-text">
                <span class="q-type-badge" id="typeBadge">單選題</span><span id="questionText">載入中...</span>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback-container" id="feedbackContainer"></div>

            <div class="control-panel">
                <button class="action-btn submit-btn" id="submitBtn" onclick="submitMultipleChoice()" style="display: none;">確認提交 ✔</button>
                <button class="action-btn next-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
            </div>
            
            <!-- 右下角角色圖片 -->
            <img src="" alt="Inside Out Character" class="character-sprite" id="charSprite" onerror="handleImageError(this)">
        </div>

        <div id="resultSection" class="result-screen">
            <div class="result-title">🧠 Inside Out 挑戰結束 🧠</div>
            <div style="font-size: 18pt; margin-bottom: 10px;">總得分：<span id="finalScoreText">0</span> / 10</div>
            <div style="font-size: 13pt; color: #666;">獲得情緒稱號：</div>
            <div class="result-badge" id="badgeText">情緒小助手</div>
            <button class="restart-btn" onclick="restartGame()">重新挑戰 ↺</button>
        </div>
    </div>

    <audio id="sndCorrect" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/cartoon_wink.ogg" type="audio/ogg"></audio>
    <audio id="sndWrong" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg" type="audio/ogg"></audio>

    <script>
        const TOTAL_QUESTIONS_PER_GAME = 10; // 每次隨機 10 題

        const fullQuestionPool = [
            { question: "我們可以從世界地圖中取得甚麼資料？", options: ["A. 知道中國境內的地方。", "B. 香港主要區域的位置。", "C. 香港各區的街道和建築物。", "D. 七大洲和四大洋的位置。"], answer: 3, isMultiple: false, charId: 1 },
            { question: "浩明在地圖上看到中國位於亞洲，香港是中國東南端的城市，又看到印度、沙特阿拉伯等國家，但是他看不到美國的位置。他正在看以下哪幅地圖？", options: ["A. 世界地圖。", "B. 香港街道圖。", "C. 亞洲地圖。", "D. 香港全境圖。"], answer: 2, isMultiple: false, charId: 2 },
            { question: "在以下哪種地圖中可以看到香港在世界上的地理位置？", options: ["A. 香港全境圖。", "B. 世界地圖。", "C. 香港街道圖。", "D. 中國地圖。"], answer: 1, isMultiple: false, charId: 3 },
            { question: "要找出九龍在香港的地理位置，我們應該閲讀以下哪種地圖？", options: ["A. 世界地圖。", "B. 亞洲地圖。", "C. 香港全境圖。", "D. 香港街道圖。"], answer: 2, isMultiple: false, charId: 4 },
            { question: "要尋找香港某幢大廈的地理位置時，我們需要以下哪種地圖？", options: ["A. 香港街道圖。", "B. 中國地圖。", "C. 亞洲地圖。", "D. 世界地圖。"], answer: 0, isMultiple: false, charId: 5 },
            { question: "香港位於以下哪個大洲？", options: ["A. 歐洲。", "B. 北美洲。", "C. 亞洲。", "D. 非洲。"], answer: 2, isMultiple: false, charId: 6 },
            { question: "以下哪項關於香港地理位置的描述是正確的？", options: ["A. 香港位於亞洲。", "B. 香港是中國西南端的城市。", "C. 香港島是香港面積最大的部分。", "D. 香港的海岸線大多是平直的。"], answer: 0, isMultiple: false, charId: 7 },
            { question: "香港是中國哪一端的城市？", options: ["A. 西北端。", "B. 東北端。", "C. 西南端。", "D. 東南端。"], answer: 3, isMultiple: false, charId: 8 },
            { question: "以下哪些是鄰近香港的國家？（答案可多於一個。）", options: ["A. 土耳其。", "B. 菲律賓。", "C. 英國。", "D. 日本。"], answer: [1, 3], isMultiple: true, charId: 9 },
            { question: "以下哪項關於香港地理環境的描述是正確的？", options: ["A. 香港是中國西南端的城市。", "B. 日本位於香港的東方。", "C. 香港與俄羅斯和加拿大相鄰。", "D. 香港分為香港島、九龍和新界三部分。"], answer: 3, isMultiple: false, charId: 10 },
            { question: "在街道圖上，我們可以獲取以下哪些資料？（答案可多於一個。）", options: ["A. 街道的名稱。", "B. 主要建築物的位置。", "C. 香港鄰近國家的位置。", "D. 交通設施的位置，例如港鐵站。"], answer: [0, 1, 3], isMultiple: true, charId: 1 },
            { question: "以下哪些是街道圖的要素？（答案可多於一個。）", options: ["A. 圖例。", "B. 比例尺。", "C. 方向標。", "D. 景點推介。"], answer: [0, 1, 2], isMultiple: true, charId: 2 },
            { question: "地圖上的格網座標有甚麼用途？", options: ["A. 顯示香港三個主要區域的位置。", "B. 提供街景功能。", "C. 讓我們知道地圖上符號所代表的事物。", "D. 方便我們找出景物在地圖上的位置。"], answer: 3, isMultiple: false, charId: 3 },
            { question: "以下哪些是街道圖上可以見到的圖例？（答案可多於一個。）", options: ["A. 寺廟。", "B. 首都。", "C. 警署。", "D. 街市。"], answer: [0, 2, 3], isMultiple: true, charId: 4 },
            { question: "以下哪些是尖沙咀地標？（答案可多於一個。）", options: ["A. 遮打花園。", "B. 九龍公園。", "C. 寶蓮寺。", "D. 九龍清真寺暨伊斯蘭中心。"], answer: [1, 3], isMultiple: true, charId: 5 },
            { question: "以下哪些是電子地圖提供的功能？（答案可多於一個。）", options: ["A. 街景。", "B. 路線規劃。", "C. 自動定位。", "D. 街道歷史。"], answer: [0, 1, 2], isMultiple: true, charId: 6 },
            { question: "以下哪項是香港地理發展的限制？", options: ["A. 缺乏平地。", "B. 平地比較集中。", "C. 河流不足。", "D. 位於地震帶。"], answer: 0, isMultiple: false, charId: 7 },
            { question: "以下哪些是香港的地勢特徵？（答案可多於一個。）", options: ["A. 平地較為分散。", "B. 海岸線曲折。", "C. 山多平地少。", "D. 河流不足。"], answer: [0, 1, 2], isMultiple: true, charId: 8 },
            { question: "以下哪些是政府用來解決香港土地供應不足的措施？（答案可多於一個。）", options: ["A. 強制人口遷移。", "B. 發展新市鎮。", "C. 興建隧道。", "D. 移山填海。"], answer: [1, 3], isMultiple: true, charId: 9 },
            { question: "以下哪項設施不是位於啟德機場騰出的土地上？", options: ["A. 公共房屋。", "B. 私人房屋。", "C. 渡輪碼頭。", "D. 體育園。"], answer: 2, isMultiple: false, charId: 10 },
            { question: "以下哪些不是連接市區和機場的措施？", options: ["A. 興建公路。", "B. 興建鐵路。", "C. 興建跨海大橋。", "D. 興建新樓宇。"], answer: 3, isMultiple: false, charId: 1 },
            { question: "興建香港國際機場時，進行了以下哪些工程？（答案可多於一個。）", options: ["A. 興建郵輪碼頭。", "B. 削平赤鱲角島。", "C. 興建體育園。", "D. 大規模填海。"], answer: [1, 3], isMultiple: true, charId: 2 },
            { question: "以下哪些是移山填海帶來的變化？（答案可多於一個。）", options: ["A. 海岸線被拉平。", "B. 動物失去棲息地。", "C. 增加土地供應。", "D. 土地價格下降。"], answer: [0, 1, 2], isMultiple: true, charId: 3 },
            { question: "以下哪些是香港的建築特色？（答案可多於一個。）", options: ["A. 樓宇集中在新界。", "B. 部分樓宇依山而建。", "C. 樓宇向高空發展。", "D. 離島沒有樓宇。"], answer: [1, 2], isMultiple: true, charId: 4 },
            { question: "以下哪項關於啟德機場的描述是不正確的？", options: ["A. 位於市區。", "B. 飛機在鬧市升降。", "C. 噪音問題嚴重。", "D. 成為航天展覽場地。"], answer: 3, isMultiple: false, charId: 5 },
            { question: "在香港，以下哪種月份的雨量最多？", options: ["A. 温暖的月份。", "B. 炎熱的月份。", "C. 乾爽的月份。", "D. 寒冷的月份。"], answer: 1, isMultiple: false, charId: 6 },
            { question: "以下哪些關於香港氣候的描述是正確的？（答案可多於一個。）", options: ["A. 熱帶氣旋大多在夏季吹襲香港。", "B. 秋季天氣温暖潮濕，經常有霧。", "C. 山火大多在秋季和冬季發生。", "D. 夏季天氣寒冷和乾燥。"], answer: [0, 2], isMultiple: true, charId: 7 },
            { question: "以下哪項關於香港四季的描述是正確的？", options: ["A. 春季天氣潮濕多霧。", "B. 夏季天氣清涼乾爽。", "C. 秋季天氣炎熱多雨。", "D. 冬季天氣潮濕少雨。"], answer: 0, isMultiple: false, charId: 8 },
            { question: "以下哪項關於香港氣候的描述是正確的？", options: ["A. 香港位於熱帶地區，氣候大致温和。", "B. 春季天氣温暖潮濕，經常有霧和毛毛雨。", "C. 冬季寒冷乾燥，經常下雪。", "D. 秋季潮濕，間中有驟雨和雷暴。"], answer: 1, isMultiple: false, charId: 9 },
            { question: "當酷熱天氣警告生效時，怎樣做才是正確的？（答案可多於一個。）", options: ["A. 多喝開水。", "B. 塗防曬霜。", "C. 遠離斜坡。", "D. 避免在戶外進行劇烈運動。"], answer: [0, 1, 3], isMultiple: true, charId: 10 },
            { question: "熱帶氣旋大多會在甚麼季節吹襲香港？", options: ["A. 春季。", "B. 夏季。", "C. 秋季。", "D. 冬季。"], answer: 1, isMultiple: false, charId: 1 },
            { question: "以下哪些是熱帶氣旋吹襲香港後可能帶來的影響？（答案可多於一個。）", options: ["A. 樹木倒塌。", "B. 山泥傾瀉。", "C. 土地乾涸。", "D. 街上物件被吹倒。"], answer: [0, 1, 3], isMultiple: true, charId: 2 },
            { question: "以下哪些不是熱帶氣旋吹襲後帶來的影響？（答案可多於一個。）", options: ["A. 引起山火。", "B. 使土地乾旱。", "C. 破壞農作物。", "D. 使人曬傷。"], answer: [0, 1], isMultiple: true, charId: 3 },
            { question: "香港天文台發出熱帶氣旋警告信號時，我們應該採取以下哪些安全措施？（答案可多於一個。）", options: ["A. 繫緊室外易被風吹倒的物件或把它們移到室內。", "B. 在當風的大玻璃窗上貼上膠紙。", "C. 走到海邊去感受颱風的威力。", "D. 儘快回家。"], answer: [0, 1, 3], isMultiple: true, charId: 4 },
            { question: "雷暴警告生效時，我們應該怎樣做？（答案可多於一個。）", options: ["A. 塗防曬霜。", "B. 立即停止水上活動。", "C. 在室外工作的人，應該到室內地方暫避。", "D. 切勿站立於山頂上或接近導電性高的物體。"], answer: [1, 2, 3], isMultiple: true, charId: 5 },
            { question: "以下哪些天氣警告信號通常於夏季發出？（答案可多於一個。）", options: ["A. 霜凍警告。", "B. 寒冷天氣警告。", "C. 酷熱天氣警告。", "D. 熱帶氣旋警告信號。"], answer: [2, 3], isMultiple: true, charId: 6 },
            { question: "熱帶氣旋警告信號生效時，以下哪些天氣警告信號通常會同時生效？（答案可多於一個。）", options: ["A. 山泥傾瀉警告。", "B. 暴雨警告信號。", "C. 雷暴警告。", "D. 紅色火災危險警告。"], answer: [0, 1, 2], isMultiple: true, charId: 7 },
            { question: "我們在秋季進行戶外活動時要注意甚麼？", options: ["A. 不要留下火種。", "B. 使用暖包。", "C. 不要進行水上活動。", "D. 閲讀熱帶氣旋路徑圖。"], answer: 0, isMultiple: false, charId: 8 },
            { question: "人們大多在秋季進行以下哪些戶外活動？（答案可多於一個。）", options: ["A. 賞花。", "B. 遠足。", "C. 放風箏。", "D. 到海灘游泳。"], answer: [1, 2], isMultiple: true, charId: 9 },
            { question: "以下哪些詞語不適宜形容香港的冬季？（答案可多於一個。）", options: ["A. 潮濕。", "B. 酷熱。", "C. 乾燥。", "D. 寒冷。"], answer: [0, 1], isMultiple: true, charId: 10 },
            { question: "寒冷天氣警告生效時，我們應該怎樣做？（答案可多於一個。）", options: ["A. 注意保暖，多穿禦寒衣物。", "B. 穿上鬆身衣服和戴上能阻隔紫外線的太陽眼鏡。", "C. 使用電暖爐或電熱毯。", "D. 多喝暖開水。"], answer: [0, 2, 3], isMultiple: true, charId: 1 },
            { question: "寒冷天氣警告生效時，我們可以怎樣幫助有需要的人？（答案可多於一個。）", options: ["A. 捐出禦寒衣物。", "B. 開放家居作為臨時避寒中心。", "C. 致電認識的獨居長者，告知相關天氣消息和了解他的需要。", "D. 留意天氣報告。"], answer: [0, 2], isMultiple: true, charId: 2 },
            { question: "寒冷天氣警告生效時，我們可以怎樣給年老的長輩送上温暖？（答案可多於一個。）", options: ["A. 給長輩送上冰涼的飲料。", "B. 給長輩送上保暖物品。", "C. 帶長輩到戶外運動。", "D. 致電長輩，提醒他們注意保暖。"], answer: [1, 3], isMultiple: true, charId: 3 }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswers = [];

        function initGame() {
            // 洗牌並隨機抽取 10 題
            const shuffled = [...fullQuestionPool].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, TOTAL_QUESTIONS_PER_GAME);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById("quizSection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            selectedAnswers = [];
            document.getElementById("feedbackContainer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            const qData = currentQuestions[currentQuestionIndex];
            
            document.getElementById("progressText").innerText = `第 ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS_PER_GAME} 題`;
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${TOTAL_QUESTIONS_PER_GAME}`;
            document.getElementById("questionText").innerText = qData.question;
            
            const typeBadge = document.getElementById("typeBadge");
            if(qData.isMultiple) {
                typeBadge.innerText = "複選題";
                typeBadge.style.backgroundColor = "#F06292";
                document.getElementById("submitBtn").style.display = "block";
            } else {
                typeBadge.innerText = "單選題";
                typeBadge.style.backgroundColor = "#90CAF9";
            }

            // 指定角色圖片檔名 (.png)
            const imgIndex = qData.charId || 1;
            const charSprite = document.getElementById("charSprite");
            charSprite.src = `inside out/insideout (${imgIndex}).png`;

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            qData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        // 圖片自動備用防錯機制
        function handleImageError(img) {
            if (img.src.endsWith('.png')) {
                img.src = img.src.replace('.png', '.jpg');
            }
        }

        function selectOption(index, btnElement) {
            const qData = currentQuestions[currentQuestionIndex];
            
            if (!qData.isMultiple) {
                checkSingleAnswer(index);
            } else {
                if (selectedAnswers.includes(index)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    btnElement.classList.remove("selected");
                } else {
                    selectedAnswers.push(index);
                    btnElement.classList.add("selected");
                }
            }
        }

        function checkSingleAnswer(selectedIndex) {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            if (selectedIndex === qData.answer) {
                score++;
                buttons[selectedIndex].classList.add("correct");
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "太棒了！答對了！✨";
                playAudio("sndCorrect");
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[qData.answer].classList.add("correct");
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#E91E63;">${qData.options[qData.answer]}</span>`;
                playAudio("sndWrong");
            }
            document.getElementById("scoreText").innerText = `目前積分：${score} / ${TOTAL_QUESTIONS_PER_GAME}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function submitMultipleChoice() {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".options-container .option-btn");
            
            if(selectedAnswers.length === 0) {
                alert("請至少選擇一個選項再提交！");
                return;
            }

            document.getElementById("submitBtn").style.display = "none";
            buttons.forEach(btn => btn.disabled = true);

            selectedAnswers.sort((a, b) => a - b);
            const correctAnswers = [...qData.answer].sort((a, b) => a - b);
            const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

            buttons.forEach((btn, idx) => {
                btn.classList.remove("selected");
                if (correctAnswers.includes(idx)) {
                    btn.classList.add("correct");
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add("wrong");
                }
            });

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            const correctTexts = correctAnswers.map(idx => qData.options[idx]).join("<br>");

            if (isCorrect) {
                score++;
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "太棒了！答對了！✨";
                playAudio("sndCorrect");
            } else {
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `喔不！答錯了，正確答案是：<br><span style="color:#E91E63; font-size:12pt;">${correctTexts}</span>`;
                playAudio("sndWrong");
            }

            document.getElementById("scoreText").innerText = `目前積分：${score} / ${TOTAL_QUESTIONS_PER_GAME}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS_PER_GAME) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("resultSection").style.display = "flex";
            document.getElementById("finalScoreText").innerText = score;

            let badge = "";
            if (score === 10) {
                badge = "地理氣候大師 (Joy)";
            } else if (score >= 7) {
                badge = "資深核心記憶專家";
            } else {
                badge = "情緒控制台實習生";
            }
            
            document.getElementById("badgeText").innerText = badge;
        }

        function restartGame() { initGame(); }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音效播不出:", e));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
