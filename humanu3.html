<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 知識大冒險！</title>
    <style>
        /* CSS 變數配置 */
        :root {
            --roblox-bg: url('https://images5.alphacoders.com/121/thumb-1920-1217521.jpg');
            --rbx-dark-alpha: rgba(25, 25, 25, 0.75);
            --rbx-green: #00B06F;
            --rbx-green-dark: #008F58;
            --rbx-red: #D32F2F;
            --rbx-red-dark: #9A2121;
            --rbx-gray: #393B3D;
            --rbx-gray-dark: #232527;
            --rbx-blue: #0074BD;
            --rbx-blue-dark: #005A92;
            --rbx-text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: var(--roblox-bg);
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 題目容器（毛玻璃效果） */
        .game-container {
            width: 90%;
            max-width: 650px;
            background: var(--rbx-dark-alpha);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 30px;
            color: var(--rbx-text);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }

        /* 陰影文字確保清晰度 */
        h1, h2, h3, p, .score-board, .feedback, .question-text {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* 計分板 */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #FFD700;
        }

        /* 題型標籤 */
        .question-type-badge {
            background-color: #FF9800;
            color: white;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            vertical-align: middle;
            margin-left: 8px;
            text-shadow: none;
            font-weight: bold;
            display: inline-block;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        /* Roblox 風格立體按鈕（預設狀態） */
        .btn-option {
            background-color: var(--rbx-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            position: relative;
            box-shadow: 0 5px 0 var(--rbx-green-dark);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            z-index: 12;
        }

        /* 懸停彈簧動畫效果 */
        .btn-option:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 0 var(--rbx-green-dark);
        }

        /* 多選點擊時的選取中狀態（亮藍色） */
        .btn-option.selected {
            background-color: var(--rbx-blue) !important;
            box-shadow: 0 5px 0 var(--rbx-blue-dark) !important;
            transform: translateY(2px);
        }

        /* 最終回饋狀態：正確綠、錯誤紅 */
        .btn-option.correct {
            background-color: #00B06F !important;
            box-shadow: 0 5px 0 #008F58 !important;
        }

        .btn-option.wrong {
            background-color: var(--rbx-red) !important;
            box-shadow: 0 5px 0 var(--rbx-red-dark) !important;
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }

        /* 回饋文字區 */
        .feedback {
            margin: 20px 0;
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 35px;
            text-align: center;
        }

        /* 功能控制鈕 */
        .control-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            display: block;
            width: 100%;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
        }

        .btn-submit {
            background-color: #FF9800;
            box-shadow: 0 4px 0 #E65100;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #FFA726;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #E65100;
        }

        .btn-next {
            background-color: var(--rbx-gray);
            box-shadow: 0 4px 0 var(--rbx-gray-dark);
        }
        .btn-next:hover {
            background-color: #4f5153;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--rbx-gray-dark);
        }

        .btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        .hidden { display: none !important; }

        /* 右下角動態角色容器 */
        .avatar-container {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 120px;
            height: 120px;
            z-index: 5;
            pointer-events: none;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 結算頁面 */
        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .badge-title {
            font-size: 2.2rem;
            color: #FFD700;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quiz-screen">
            <div class="score-board">
                <span id="progress-text">題目：1 / 10</span>
                <span id="score-text">目前 Robux 積分：0 / 10</span>
            </div>
            
            <div class="question-text">
                <span id="question-field">載入題目中...</span>
                <span id="type-badge" class="question-type-badge">單選題</span>
            </div>
            
            <div class="options-container" id="options-field"></div>
            
            <div class="feedback hidden" id="feedback-field"></div>
            
            <div class="control-area">
                <button class="btn-action btn-submit" id="btn-submit-action">確認送出 ✔</button>
                <button class="btn-action btn-next hidden" id="btn-next-action">下一題 ➔</button>
            </div>
        </div>

        <div id="result-screen" class="result-screen hidden">
            <h2>🎉 挑戰完成！ 🎉</h2>
            <p style="font-size: 1.4rem;">你的最終得分</p>
            <div class="badge-title" id="final-score">0 / 10</div>
            <p style="font-size: 1.2rem;">獲得 Roblox 專屬稱號：</p>
            <div class="badge-title" id="roblox-rank" style="font-size: 2rem; color: #00E6FF;">-</div>
            <button class="btn-action btn-submit" onclick="restartGame()" style="margin-top: 30px;">再次挑戰 ↻</button>
        </div>

        <div class="avatar-container">
            <img id="roblox-avatar" class="avatar-img" src="" alt="Roblox Character">
        </div>
    </div>

    <audio id="sound-correct" src="https://www.soundjay.com/buttons/sounds/button-09a.mp3"></audio> 
    <audio id="sound-wrong" src="https://www.soundjay.com/buttons/sounds/button-10a.mp3"></audio>

    <script>
        // 已更換為你提供的 38 條中華與世界文化常識題目
        const pool = [
            { question: "以下哪些是春天的節氣？", options: ["A. 🌸 立春。", "B. 💧 雨水。", "C. 🌲 清明。", "D. ☀️ 小暑。"], answer: [0, 1, 2] },
            { question: "以下哪項不是二十四節氣？", options: ["A. 🍂 清明。", "B. ☀️ 夏至。", "C. 🌾 重陽。", "D. ❄️ 大雪。"], answer: [2] },
            { question: "以下哪些節氣可以用於指導農事活動？", options: ["A. 🌾 穀雨。", "B. 🌱 芒種。", "C. ❄️ 小雪。", "D. 🧄 冬至。"], answer: [0, 1] },
            { question: "二十四節氣中，哪一個節氣當天是北半球全年白晝最長的一天？", options: ["A. 🌱 春分。", "B. ☀️ 夏至。", "C. 🍁 秋分。", "D. ❄️ 冬至。"], answer: [1] },
            { question: "二十四節氣中，哪兩個節氣是我國傳統節日？", options: ["A. 🕯️ 清明。", "B. ☀️ 夏至。", "C. 🍂 立秋。", "D. 🥣 冬至。"], answer: [0, 3] },
            { question: "以下哪項對二十四節氣的描述是不正確的？", options: ["A. 🗓️ 二十四節氣是我國很久以前開創的曆法。", "B. 🍁 二十四節氣反映季節的變化。", "C. 🌾 二十四節氣指導人們耕作和生活。", "D. ❌ 二十四節氣現在已經不重要了。"], answer: [3] },
            { question: "以下哪些是唐朝服裝的特色？", options: ["A. 📿 男士有佩戴香囊的習慣。", "B. 🥋 男士穿長袍和馬褂為主。", "C. 👗 女士穿長袍為主。", "D. 👑 女士多穿低領長裙配披肩。"], answer: [0, 4] },
            { question: "我們現在一般會在甚麼日子穿我國傳統服裝？", options: ["A. 🎄 聖誕節。", "B. 🧧 農曆新年。", "C. 💍 結婚。", "D. 🌹 母親節。"], answer: [1, 2] },
            { question: "以下哪些是我們上酒樓吃飯時的飲食習慣？", options: ["A. 🍽️ 一人一份餐。", "B. 🥢 使用碗和筷子進食。", "C. 👨‍👩‍👧 一家人圍坐進食。", "D. 🍕 主要吃薄餅和意粉。"], answer: [1, 2] },
            { question: "以下哪些是元朗大夫第的建築特色？", options: ["A. 🐉 屋脊上有生動的陶塑人偶。", "B. 🦇 窗户的雕刻有代表「福」的蝙蝠圖案。", "C. 🏯 正廳的台基較矮。", "D. 🏠 整座房子面積小。"], answer: [0, 1] },
            { question: "以下哪項是福建的特色房屋？", options: ["A. ⭕ 土樓。", "B. 🪵 吊腳樓。", "C. ⛺ 蒙古包。", "D. ⛰️ 窰洞。"], answer: [0] },
            { question: "以下哪項了我國的傳統繪畫？", options: ["A. 🎨 水彩畫。", "B. 🖌️ 水墨畫。", "C. 🖼️ 油畫。", "D. ✏️ 素描。"], answer: [1] },
            { question: "以下哪些是國畫的主要題材？", options: ["A. ⛰️ 山水。", "B. 🐦 花鳥。", "C. ☁️ 天空。", "D. 👥 人物。"], answer: [0, 1, 3] },
            { question: "以下哪些是國畫的特色？", options: ["A. 🖤 以水墨為主。", "B. 🦁 主要以動物為題材。", "C. 🎨 以山水、人物和花鳥為題材。", "D. 🌈 色彩豐富豔麗。"], answer: [0, 2] },
            { question: "採茶舞是以下我國哪個民族的舞蹈？", options: ["A. 🐴 蒙古族。", "B. 🦚 傣族。", "C. 🏝️ 黎族。", "D. 🌾 漢族。"], answer: [3] },
            { question: "以下哪項是傣族的民族舞蹈？", options: ["A. 🦚 孔雀舞。", "B. 🐴 騎馬舞。", "C. 🍃 採茶舞。", "D. 🌾 舂米舞。"], answer: [0] },
            { question: "以下哪項是蒙古族的舞蹈？", options: ["A. 🦚 孔雀舞。", "B. 🍃 採茶舞。", "C. 🐴 騎馬舞。", "D. 🌾 舂米舞。"], answer: [2] },
            { question: "以下哪項是我國其中一種民族舞蹈？", options: ["A. 💃 拉丁舞。", "B. 🩰 芭蕾舞。", "C. 🦚 孔雀舞。", "D. 🌹 佛朗明哥舞。"], answer: [2] },
            { question: "以下哪種我國傳統樂器屬於拉弦樂？", options: ["A. 🥁 鼓。", "B. 🎻 二胡。", "C. 🎸 琵琶。", "D. 🎵 笛。"], answer: [1] },
            { question: "《憫農》這首唐詩中表達了哪項我國傳統美德？", options: ["A. 🤝 團結。", "B. 🙇 謙遜。", "C. 🌾 勤勞。", "D. 🪵 堅毅。"], answer: [2] },
            { question: "以下哪些書籍是我國四大名著？", options: ["A. 🌹 《紅樓夢》。", "B. 🌆 《雙城記》。", "C. 🐒 《西遊記》。", "D. 🌿 《本草綱目》。"], answer: [0, 2] },
            { question: "以下哪項不是我國四大名著？", options: ["A. 🐒 《西遊記》。", "B. 🌊 《水滸傳》。", "C. 😿 《孤星淚》。", "D. ⚔️ 《三國演義》。"], answer: [2] },
            { question: "以下哪項描述是不正確的？", options: ["A. 🌍 世界各地的人有不同的風俗習慣。", "B. ❌ 香港沒有受到外來文化的影響。", "C. 🏡 各地人民的生活環境和方式構成了各自獨特的文化。", "D. 💖 各地的文化有值得我們欣賞的地方。"], answer: [1] },
            { question: "和服是以下哪個國家的傳統服裝？", options: ["A. 🇰🇷 韓國。", "B. 🇮🇳 印度。", "C. 🇮🇩 印尼。", "D. 🇯🇵 日本。"], answer: [3] },
            { question: "以下哪種是日本的特色食品？", options: ["A. 🍣 壽司。", "B. 🥣 白粥。", "C. 🍟 薯條。", "D. 🥬 泡菜。"], answer: [0] },
            { question: "以下哪種是印度的傳統食物？", options: ["A. 🍜 河粉。", "B. 🍛 咖喱。", "C. 🥟 餃子。", "D. 🍝 意粉。"], answer: [1] },
            { question: "以下哪個國家的人主要使用刀叉進食？", options: ["A. 🇮🇳 印度。", "B. 🇯🇵 日本。", "C. 🇰🇷 韓國。", "D. 🇬🇧 英國。"], answer: [3] },
            { question: "以下哪個國家的人主要使用筷子進食？", options: ["A. 🇩🇪 德國。", "B. 🇫🇮 芬蘭。", "C. 🇦🇺 澳洲。", "D. 🇰🇷 韓國。"], answer: [3] },
            { question: "以下哪項是印度人的主要進食習慣？", options: ["A. 🍴 用刀叉進食。", "B. 🥢 用筷子進食。", "C. 🖐️ 用左手抓飯吃。", "D. ✋ 用右手抓飯吃。"], answer: [3] },
            { question: "以下哪項關於日本法隆寺的描述是正確的？", options: ["A. ⛪ 是基督教建築。", "B. 🏛️ 建築風格受西方影響。", "C. 🪵 是世界最古老的木造建築。", "D. 🏠 曾經是平民的居所。"], answer: [2] },
            { question: "泰國玉佛寺是以下哪個宗教的建築？", options: ["A. ⛪ 基督教。", "B. ✝️ 天主教。", "C. 🪷 佛教。", "D. 🕉️ 印度教。"], answer: [2] },
            { question: "以下哪種宗教的建築一般有圓形拱頂？", options: ["A. ⛪ 基督教。", "B. ✝️ 天主教。", "C. 🪷 佛教。", "D. 🌙 伊斯蘭教。"], answer: [3] },
            { question: "佛朗明哥舞是以下哪個國家的傳統舞蹈？", options: ["A. 🇯🇵 日本。", "B. 🇰🇷 韓國。", "C. 🇧🇷 巴西。", "D. 🇪🇸 西班牙。"], answer: [3] },
            { question: "以下哪些是香港受到外來文化影響的例子？", options: ["A. 🥧 蛋撻。", "B. 🥮 葡撻。", "C. 🧋 奶茶。", "D. 🥟 小籠包。"], answer: [0, 1, 2] },
            { question: "以下哪些不是日本傳統文化？", options: ["A. 💃 在祭典活動跳拉丁舞。", "B. 🍵 喜歡吃海產和喝茶。", "C. 👘 在傳統節日穿和服。", "D. 🍴 用刀叉進食。"], answer: [0, 3] },
            { question: "越南的傳統服裝主要受哪個國家的影響？", options: ["A. 🇨🇳 中國。", "B. 🇫🇷 法國。", "C. 🇬🇧 英國。", "D. 🇩🇪 德國。"], answer: [0] },
            { question: "一家人圍坐進食體現甚麼精神？", options: ["A. 🤝 團結。", "B. 🙇 謙遜。", "C. 🌾 勤勞。", "D. 🪵 堅毅。"], answer: [0] },
            { question: "我們用餐時要避免做出以下哪項不禮貌的行為？", options: ["A. 🤫 口中有食物時不説話。", "B. 🙅 不翻弄食物。", "C. 🔊 進食時發出聲響以表示謝意。", "D. 🪑 吃飯途中，不隨便離座。"], answer: [2] }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedAnswers = []; 

        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const questionField = document.getElementById('question-field');
        const typeBadge = document.getElementById('type-badge');
        const optionsField = document.getElementById('options-field');
        const feedbackField = document.getElementById('feedback-field');
        const btnSubmitAction = document.getElementById('btn-submit-action');
        const btnNextAction = document.getElementById('btn-next-action');
        const avatarImg = document.getElementById('roblox-avatar');

        // 初始化遊戲：隨機抽 10 題
        function initGame() {
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 10); 
            currentIndex = 0;
            score = 0;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        // 渲染題目與選項
        function showQuestion() {
            feedbackField.classList.add('hidden');
            btnNextAction.classList.add('hidden');
            btnSubmitAction.classList.remove('hidden');
            optionsField.innerHTML = '';
            selectedAnswers = [];

            const qData = currentQuestions[currentIndex];
            
            progressText.innerText = `題目：${currentIndex + 1} / 10`;
            scoreText.innerText = `目前 Robux 積分：${score} / 10`;
            questionField.innerText = qData.question;

            // 自動根據正確答案的數量切換單多選標籤提示
            if (qData.answer.length > 1) {
                typeBadge.innerText = "多選題（答案可多於一個）";
                typeBadge.style.backgroundColor = "#FF9800";
            } else {
                typeBadge.innerText = "單選題";
                typeBadge.style.backgroundColor = "#0074BD";
            }

            // 隨機挑選 1~10 號貼圖
            const randomImageNumber = Math.floor(Math.random() * 10) + 1;
            avatarImg.src = `Roblox/guest (${randomImageNumber}).png`;

            // 生成立體選項按鈕
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => toggleOption(idx, btn);
                optionsField.appendChild(btn);
            });
        }

        // 點擊切換選取狀態
        function toggleOption(idx, btn) {
            const qData = currentQuestions[currentIndex];
            
            if (qData.answer.length === 1) {
                // 單選題：互斥切換
                const allButtons = optionsField.querySelectorAll('.btn-option');
                allButtons.forEach(b => b.classList.remove('selected'));
                selectedAnswers = [idx];
                btn.classList.add('selected');
            } else {
                // 多選題：自由勾選與取消
                if (selectedAnswers.includes(idx)) {
                    selectedAnswers = selectedAnswers.filter(item => item !== idx);
                    btn.classList.remove('selected');
                } else {
                    selectedAnswers.push(idx);
                    btn.classList.add('selected');
                }
            }
        }

        // 確認送出與完全對判定邏輯
        btnSubmitAction.onclick = () => {
            if (selectedAnswers.length === 0) {
                alert("請至少選擇一個答案再送出！");
                return;
            }

            const qData = currentQuestions[currentIndex];
            const allButtons = optionsField.querySelectorAll('.btn-option');

            allButtons.forEach(btn => btn.disabled = true);
            btnSubmitAction.classList.add('hidden');

            // 雙向排序後比對陣列內容是否完美一致
            const playerSorted = [...selectedAnswers].sort((a, b) => a - b);
            const correctSorted = [...qData.answer].sort((a, b) => a - b);
            const isFullyCorrect = playerSorted.length === correctSorted.length && 
                                   playerSorted.every((val, index) => val === correctSorted[index]);

            // 轉換正確答案字母代號
            const correctLabels = qData.answer.map(i => {
                // 提取 A, B, C, D 字母
                return qData.options[i].trim().split(' ')[0].replace('.', '');
            }).join('、');

            // 反饋按鈕視覺轉變
            allButtons.forEach((btn, idx) => {
                btn.classList.remove('selected');
                if (qData.answer.includes(idx)) {
                    btn.classList.add('correct'); // 正確答案強制變綠
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add('wrong'); // 選錯的強制變紅
                }
            });

            // 得分與音效控制
            if (isFullyCorrect) {
                score++;
                scoreText.innerText = `目前 Robux 積分：${score} / 10`;
                feedbackField.innerText = "✨ 太棒了！全答對了！ ✨";
                feedbackField.style.color = "#00B06F";
                document.getElementById('sound-correct').currentTime = 0;
                document.getElementById('sound-correct').play().catch(e => {});
            } else {
                feedbackField.innerText = `喔不！沒全對。正確答案是：[ ${correctLabels} ]`;
                feedbackField.style.color = "#FF5252";
                document.getElementById('sound-wrong').currentTime = 0;
                document.getElementById('sound-wrong').play().catch(e => {});
            }

            feedbackField.classList.remove('hidden');
            btnNextAction.classList.remove('hidden');
        };

        // 下一題流程
        btnNextAction.onclick = () => {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showEndScreen();
            }
        };

        // 結算畫面
        function showEndScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / 10`;

            let rank = "";
            if (score === 10) {
                rank = "👑 Roblox 創造神 (Builderman) 👑";
            } else if (score >= 7) {
                rank = "🛠️ 資深開發者 (Developer) 🛠️";
            } else {
                rank = "🎒 萌新小路過 (Noob) 🎒";
            }
            document.getElementById('roblox-rank').innerText = rank;
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
