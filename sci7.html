<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學新領域大挑戰 - 物質的特性和變化</title>
    <style>
        :root {
            --bg-image: url('https://images7.alphacoders.com/592/thumb-1920-592678.jpg');
            --glass-bg: rgba(255, 255, 255, 0.2);
            --correct-color: #4CAF50;
            --wrong-color: #f44336;
            --pokeball-red: #f00000;
            --pokeball-white: #ffffff;
            --pokeball-black: #222222;
        }

        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 題目容器 - 毛玻璃效果 */
        #game-container {
            width: 95%;
            max-width: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        h2, h3, #score-display {
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8), 0 0 5px rgba(0,0,0,0.1);
            color: #222;
            margin-top: 0;
        }

        #score-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 15px;
        }

        #question-text {
            font-size: 1.3rem;
            line-height: 1.5;
            margin-bottom: 20px;
            z-index: 2;
            font-weight: bold;
            color: #111;
        }

        /* 精靈球按鈕設計 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            z-index: 2;
        }

        .option-btn {
            position: relative;
            padding: 12px 20px;
            border: 3px solid var(--pokeball-black);
            border-radius: 50px;
            background: linear-gradient(to bottom, var(--pokeball-red) 45%, var(--pokeball-black) 45%, var(--pokeball-black) 55%, var(--pokeball-white) 55%);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: left;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 覆蓋層讓文字清晰 */
        .option-btn span {
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 15px;
            border-radius: 20px;
            width: 100%;
            border: 1px solid #ccc;
        }

        .option-btn.correct { background: var(--correct-color); color: white; border-color: #388E3C; }
        .option-btn.wrong { background: var(--wrong-color); color: white; border-color: #D32F2F; }
        .option-btn.correct span, .option-btn.wrong span { background: transparent; border: none; color: white; }

        /* 動態寶可夢圖片 */
        #pokemon-img {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 140px;
            height: 140px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }

        /* 回饋與下一題 */
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.3rem;
            min-height: 1.5em;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        #next-btn {
            display: none;
            margin: 15px auto 0;
            width: 70px;
            height: 70px;
            background-color: var(--pokeball-red);
            color: white;
            border: 4px solid var(--pokeball-black);
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        #next-btn:hover { transform: rotate(15deg) scale(1.1); }

        /* 結算頁面 */
        #result-screen {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .rank { font-size: 2rem; color: #e65100; margin-top: 10px; font-weight: bold; }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="quiz-screen">
            <div id="score-display">當前得分：0 / 10</div>
            <div id="question-text">載入題目中...</div>
            <div class="options-grid" id="options-container"></div>
            <div id="feedback"></div>
            <button id="next-btn">下一題</button>
            <img id="pokemon-img" src="" alt="pokemon">
        </div>

        <div id="result-screen">
            <h2>挑戰結束！</h2>
            <h1 id="final-score">得分：0 / 10</h1>
            <div class="rank" id="rank-text">稱號：科學新手</div>
            <button onclick="location.reload()" style="margin-top:30px; padding:12px 25px; font-size:1.1rem; font-weight:bold; cursor:pointer; border-radius:10px; border:2px solid #333; background-color:#fff;">重新挑戰</button>
        </div>
    </div>

    <audio id="snd-correct" src=""></audio>
    <audio id="snd-wrong" src=""></audio>

    <script>
        // 轉換後的常識科單元七題目數據
        // 答案規格：單選為單一數字，多選為數字陣列（0=A, 1=B, 2=C, 3=D）
        const allQuestions = [
            { q: "以下哪項是大部分金屬的特性？", o: ["有彈性。", "透光。", "易碎。", "有光澤和反光。"], a: 3, id: 25 }, 
            { q: "以下哪項是大部分金屬的特性？", o: ["易碎。", "無光澤。", "堅硬。", "不導熱。"], a: 2, id: 6 }, 
            { q: "以下哪項不是大部分金屬的特性？", o: ["易碎。", "不透光。", "呈黑色。", "有光澤和反光。"], a: [0, 2], multi: true, id: 1 }, 
            { q: "以下哪項物品能夠導電？", o: ["木棒。", "膠尺。", "銅線。", "紙張。"], a: 2, id: 4 }, 
            { q: "以下哪些物品不能夠導電？", o: ["鐵釘。", "橡皮。", "書釘。", "膠尺。"], a: [1, 3], multi: true, id: 7 }, 
            { q: "以下哪些描述是不正確的？", o: ["金屬能夠導電。", "大部分非金屬不能夠導電。", "大部分金屬是絕緣體。", "金屬不是導電體。"], a: [2, 3], multi: true, id: 54 }, 
            { q: "以下哪項描述是不正確的？", o: ["電線外層是由塑膠製成的。", "電線是由不同的物料製成的。", "電線內層是由金屬製成的。", "電線外層都是藍色的。"], a: 3, id: 131 }, 
            { q: "以下哪項物料適合製造電線外層？", o: ["銅。", "塑膠。", "鐵。", "鋁。"], a: 1, id: 64 }, 
            { q: "以下哪些要用金屬製造？", o: ["電插頭的插腳。", "電插頭的外殼。", "電線內層。", "電線外層。"], a: [0, 2], multi: true, id: 63 }, 
            { q: "為甚麼電線內層不能用塑膠製造？", o: ["因為塑膠是不良導熱體。", "因為塑膠不能夠導電。", "因為塑膠是絕緣體。", "因為塑膠不能有效導熱。"], a: [1, 2], multi: true, id: 65 }, 
            { q: "為甚麼電線外層和電插頭的外殼要用塑膠製造？", o: ["因為可以防止觸電。", "因為塑膠能有效隔熱。", "因為塑膠能有效導熱。", "因為塑膠是導電體。"], a: 0, id: 150 }, 
            { q: "以下哪項物料是優良導熱體？", o: ["銅。", "木。", "布。", "塑膠。"], a: 0, id: 151 }, 
            { q: "以下哪些物料是不良導熱體？", o: ["木。", "布。", "銅。", "塑膠。"], a: [0, 1, 3], multi: true, id: 122 }, 
            { q: "以下哪些物料適合製作隔熱用品？", o: ["木。", "布。", "塑膠。", "金屬。"], a: [0, 1, 2], multi: true, id: 52 }, 
            { q: "為甚麼煮食鍋的鍋身用金屬製造？", o: ["因為金屬有光澤。", "因為金屬是不良導熱體。", "因為金屬不透光。", "因為金屬是優良導熱體。"], a: 3, id: 39 }, 
            { q: "為甚麼一些水壺外會有一個膠杯套？", o: ["因為塑膠是優良的導熱體。", "因為塑膠是不良的導熱體。", "因為塑膠能夠有效導熱。", "因為塑膠能夠導電。"], a: 1, id: 40 }, 
            { q: "以下哪些物品所用的物料能有效隔熱？", o: ["木鏟。", "膠墊。", "金屬鍋。", "布質手套。"], a: [0, 1, 3], multi: true, id: 143 }, 
            { q: "以下哪些物件的變化不會生成新物質？", o: ["拉長橡皮圈。", "擠壓泥膠。", "紙張燃燒。", "鐵釘生鏽。"], a: [0, 1], multi: true, id: 133 }, 
            { q: "以下哪項物件的變化會生成新物質？", o: ["泥膠被擠壓。", "橡皮圈被拉長。", "鐵釘生鏽。", "玻璃被打碎。"], a: 2, id: 149 }, 
            { q: "以下哪項物件的變化不會生成新物質？", o: ["草莓發霉。", "牛奶變質。", "枯葉腐爛。", "橡皮圈拉長。"], a: 3, id: 9 }, 
            { q: "以下哪種情況會生成新物質？", o: ["泥膠被擠壓。", "紙張燃燒。", "玻璃被打碎。", "冰塊融化。"], a: 1, id: 45 }, 
            { q: "以下哪項變化是物理變化？", o: ["鐵釘生鏽。", "紙張燃燒。", "冰塊融化。", "枯葉腐爛。"], a: 2, id: 144 }, 
            { q: "以下哪項變化是物理變化？", o: ["牛奶變質。", "把雞蛋煎熟。", "把紙張撕碎。", "鐵釘生鏽。"], a: 2, id: 145 }, 
            { q: "以下哪項變化是化學變化？", o: ["蠟燭熔化。", "蠟燭燃燒。", "紙張摺疊。", "水凝固。"], a: 1, id: 146 }, 
            { q: "鐵釘生鏽後，會有甚麼變化？", o: ["比較容易被磁鐵吸引。", "表面比較光滑。", "周圍會生成呈棕色的新物質。", "更有光澤。"], a: 2, id: 59 }, 
            { q: "燃燒的蠟燭，其火焰底部發生了甚麼變化？", o: ["物理變化。", "化學變化。", "物理變化和化學變化。", "沒有變化。"], a: 2, id: 58 }, 
            { q: "以下哪項變化是物理變化？", o: ["燃燒煤。", "燃燒石油。", "降雨。", "廚餘堆肥。"], a: 2, id: 37 }
        ];

        let currentQuiz = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options-container');
        const scoreEl = document.getElementById('score-display');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const pokeImg = document.getElementById('pokemon-img');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        // 初始化遊戲，從 27 題中隨機抽取 10 題
        function initGame() {
            currentQuiz = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
            currentIndex = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            nextBtn.style.display = 'none';
            feedbackEl.innerText = '';
            const data = currentQuiz[currentIndex];
            
            scoreEl.innerText = `當前得分：${score} / 10 (第 ${currentIndex + 1} 題)`;
            
            // 判斷是否多選題並加上提示字眼
            if(data.multi) {
                questionEl.innerText = data.q + " (答案可多於一個)";
            } else {
                questionEl.innerText = data.q;
            }

            optionsEl.innerHTML = '';
            data.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${String.fromCharCode(65 + index)}. ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsEl.appendChild(btn);
            });

            // 隨機選一個非 0 的精靈球編號，或者根據題目原設綁定 ID
            pokeImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${data.id}.png`;
        }

        function checkAnswer(idx, btn) {
            if (answered) return;
            
            const data = currentQuiz[currentIndex];
            // 統一將正確答案包裝成陣列處理
            const correctAnswers = Array.isArray(data.a) ? data.a : [data.a];
            
            if (correctAnswers.includes(idx)) {
                btn.classList.add('correct');
                feedbackEl.innerText = "答對了！太棒了！";
                feedbackEl.style.color = "#2E7D32";
                score++;
                document.getElementById('snd-correct').play().catch(()=>{});
            } else {
                btn.classList.add('wrong');
                const correctText = correctAnswers.map(i => String.fromCharCode(65+i)).join('、');
                feedbackEl.innerText = `答錯了！正確答案是：${correctText}`;
                feedbackEl.style.color = "#C62828";
                document.getElementById('snd-wrong').play().catch(()=>{});
                
                // 將所有正確答案的選項按鈕一併亮起綠色
                const btns = optionsEl.getElementsByClassName('option-btn');
                correctAnswers.forEach(correctIdx => {
                    btns[correctIdx].classList.add('correct');
                });
            }

            answered = true;
            nextBtn.style.display = 'block';
            scoreEl.innerText = `當前得分：${score} / 10 (第 ${currentIndex + 1} 題)`;
        }

        nextBtn.onclick = () => {
            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            document.getElementById('final-score').innerText = `總得分：${score} / 10`;
            
            let rank = "";
            if (score === 10) rank = "科學大師 👑";
            else if (score >= 7) rank = "常識高材生 🧪";
            else rank = "科學實習生 📝";
            
            document.getElementById('rank-text').innerText = `稱號：${rank}`;
        }

        initGame();
    </script>
</body>
</html>
