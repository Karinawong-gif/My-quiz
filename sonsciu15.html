<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiikawa Weeding Certification Challenge - Light</title>
    <style>
        :root {
            --bg-image: url('chiikawa/chiikawa wallpeaper.avif');
            --container-bg: rgba(255, 255, 255, 0.5); /* Semi-transparent white 50% */
            --primary-pink: #FFC0CB; /* Option background: Pink */
            --primary-pink-hover: #FFD1DC;
            --powder-blue: #B0E0E6; /* Correct: Powder Blue */
            --wrong-red: #FF8A8A; /* Wrong: Red */
            --text-dark: #444444;
            --btn-gray: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: var(--text-dark);
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;
        }

        .score-points {
            color: #FF69B4; 
        }

        .question-text {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .q-type-badge {
            background-color: #90CAF9;
            color: white;
            font-size: 10pt;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .option-btn {
            background-color: var(--primary-pink);
            color: #444;
            border: none;
            border-bottom: 5px solid #FFB2C1;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-pink-hover);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .option-btn.correct {
            background-color: var(--powder-blue) !important;
            border-bottom-color: #98D0D6 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-bottom-color: #E57373 !important;
        }

        .option-btn.selected {
            background-color: #FFD180; 
            border-bottom-color: #FFB74D;
        }

        .character-sprite {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 110px;
            height: 110px;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
        }

        .feedback-container {
            margin-top: 10px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            font-size: 13pt;
            font-weight: bold;
            display: none;
            z-index: 2;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: center;
        }

        .feedback-success { color: #00897B; }
        .feedback-fail { color: #D32F2F; }

        .control-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        .action-btn {
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 50px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .submit-btn {
            background-color: #4DD0E1;
            border-bottom: 4px solid #26C6DA;
        }

        .next-btn {
            background-color: var(--btn-gray);
            border-bottom: 4px solid #555;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-title {
            font-size: 24pt;
            color: #FF69B4;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .result-badge {
            font-size: 20pt;
            font-weight: bold;
            color: #5C6BC0;
            margin-top: 15px;
            margin-bottom: 35px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #FFC0CB;
        }

        .restart-btn {
            background-color: #90CAF9;
            border-bottom: 5px solid #64B5F6;
            border-radius: 12px;
            padding: 14px 40px;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="quizSection" style="display: block; width: 100%;">
            <div class="score-header">
                <span id="progressText">Question 1 / 15</span>
                <span class="score-points" id="scoreText">Current Score: 0 / 15</span>
            </div>

            <div class="question-text">
                <span class="q-type-badge" id="typeBadge">Single Choice</span><span id="questionText">Loading...</span>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback-container" id="feedbackContainer"></div>

            <div class="control-panel">
                <button class="action-btn submit-btn" id="submitBtn" onclick="submitMultipleChoice()" style="display: none;">Submit ✔</button>
                <button class="action-btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Question ➔</button>
            </div>
            
            <img src="chiikawa/chiikawa (2).png" alt="Character" class="character-sprite" id="charSprite">
        </div>

        <div id="resultSection" class="result-screen">
            <div class="result-title">🍃 Challenge Completed 🍃</div>
            <div style="font-size: 18pt; margin-bottom: 10px;">Total Score: <span id="finalScoreText">0</span> / 15</div>
            <div style="font-size: 13pt; color: #666;">You have earned:</div>
            <div class="result-badge" id="badgeText">Level 3 Weeding Certificate</div>
            <button class="restart-btn" onclick="restartGame()">Try Again ↺</button>
        </div>
    </div>

    <audio id="sndCorrect" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/cartoon_wink.ogg" type="audio/ogg"></audio>
    <audio id="sndWrong" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg" type="audio/ogg"></audio>

    <script>
        // Updated with your 15 Light Science questions
        const fullQuestionPool = [
            { question: "Which of these objects are light sources? (There can be more than one answer.)", options: ["A. light bulb", "B. plastic ruler", "C. the Moon", "D. the Sun"], answer: [0, 3], isMultiple: true, robloxId: 1 },
            { question: "Which of these objects do not give off light? (There can be more than one answer.)", options: ["A. projector", "B. aluminium foil", "C. paper puppet", "D. torch"], answer: [1, 2], isMultiple: true, robloxId: 2 },
            { question: "Which of these descriptions about light is correct?", options: ["A. People can see because of light.", "B. Reflected light from objects is not light.", "C. Light can only come from light sources.", "D. People can only see things that give off light."], answer: 0, isMultiple: false, robloxId: 3 },
            { question: "Which of these descriptions about light are correct? (There can be more than one answer.)", options: ["A. Both the Sun and electric lights are light sources.", "B. Light can come from a light source or from reflected light from an object.", "C. Objects only reflect light during the day.", "D. People can only see things that give off light."], answer: [0, 1], isMultiple: true, robloxId: 4 },
            { question: "Which of these objects can light pass through?", options: ["A. mirror", "B. wooden table", "C. glass window", "D. wall"], answer: 2, isMultiple: false, robloxId: 5 },
            { question: "Which of these descriptions about light is not correct?", options: ["A. Light can pass through any object.", "B. When light shines on an opaque object, it casts a shadow.", "C. Light can pass through transparent objects.", "D. When light shines on a mirror, it changes the direction it travels."], answer: 0, isMultiple: false, robloxId: 6 },
            { question: "Why does light form a clear image when it shines on a mirror? (There can be more than one answer.)", options: ["A. Because when light shines on a mirror, the surface reflects it in many directions.", "B. Because the surface of a mirror is smooth.", "C. Because the surface of a mirror is rough.", "D. Because when light shines on a mirror, the surface reflects it in a specific direction."], answer: [1, 3], isMultiple: true, robloxId: 7 },
            { question: "Why does light shining on aluminum foil forms a blurred image? (There can be more than one answer.)", options: ["A. Because when light shines on aluminium foil, the surface reflects it in many directions.", "B. Because when light shines on aluminium foil, the surface reflects it in a specific direction.", "C. Because the surface of aluminium foil is rough.", "D. Because the surface of aluminium foil is smooth."], answer: [0, 2], isMultiple: true, robloxId: 8 },
            { question: "Which of these objects will form a clear image when light shines on them? (There can be more than one answer.)", options: ["A. cling film", "B. mirror", "C. rippled water surface", "D. calm water surface"], answer: [1, 3], isMultiple: true, robloxId: 9 },
            { question: "Which of these surfaces can form a clear image?", options: ["A. muddy ground", "B. switched-off phone screen", "C. rippled water surface", "D. sandpaper"], answer: 1, isMultiple: false, robloxId: 10 },
            { question: "Which of these objects will form a blurred image when light shines on them? (There can be more than one answer.)", options: ["A. rippled water surface", "B. mirror", "C. aluminium foil", "D. calm water surface"], answer: [0, 12], answer: [0, 2], isMultiple: true, robloxId: 11 }, // Index fixed from text (rippled and aluminium)
            { question: "Why does light form a clear reflection on a calm water surface? (There can be more than one answer.)", options: ["A. Because a calm water surface reflects light in many directions.", "B. Because a calm water surface is smooth.", "C. Because a calm water surface reflects light in a specific direction.", "D. Because a calm water surface is uneven."], answer: [1, 2], isMultiple: true, robloxId: 12 },
            { question: "Why does light form a blurred reflection on a rippled water surface? (There can be more than one answer.)", options: ["A. Because a rippled water surface reflects light in many directions.", "B. Because a rippled water surface is uneven.", "C. Because a rippled water surface reflects light in a specific direction.", "D. Because a rippled water surface is smooth."], answer: [0, 1], isMultiple: true, robloxId: 13 },
            { question: "What are the necessary conditions for a puddle on the ground to form a clear reflection? (There can be more than one answer.)", options: ["A. The surface of the puddle has ripples.", "B. There is a light source.", "C. The surface of the puddle is smooth.", "D. The surface of the puddle is uneven."], answer: [1, 2], isMultiple: true, robloxId: 14 },
            { question: "Why can we see a bright Moon from the Earth?", options: ["A. Because the Moon gives off its own light.", "B. Because the Moon absorbs sunlight during the day and releases it at night.", "C. Because sunlight shines on the Moon, and the Moon reflects the sunlight to the Earth.", "D. Because light from the Earth shines on the Moon, and the Moon reflects it back to the Earth."], answer: 2, isMultiple: false, robloxId: 15 }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswers = [];

        function initGame() {
            // Shuffle all 15 questions and use the entire pool
            currentQuestions = [...fullQuestionPool].sort(() => 0.5 - Math.random());
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById("quizSection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            selectedAnswers = [];
            document.getElementById("feedbackContainer").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("submitBtn").style.display = "none";

            const qData = currentQuestions[currentQuestionIndex];
            const totalQ = currentQuestions.length;
            
            document.getElementById("progressText").innerText = `Question ${currentQuestionIndex + 1} / ${totalQ}`;
            document.getElementById("scoreText").innerText = `Current Score: ${score} / ${totalQ}`;
            document.getElementById("questionText").innerText = qData.question;
            
            const typeBadge = document.getElementById("typeBadge");
            if(qData.isMultiple) {
                typeBadge.innerText = "Multiple Choice";
                typeBadge.style.backgroundColor = "#F06292";
                document.getElementById("submitBtn").style.display = "block";
            } else {
                typeBadge.innerText = "Single Choice";
                typeBadge.style.backgroundColor = "#90CAF9";
            }

            // Adjust character asset indexing
            const imgIndex = (qData.robloxId % 10) || 2;
            document.getElementById("charSprite").src = `chiikawa/chiikawa (${imgIndex}).png`;

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            qData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            const qData = currentQuestions[currentQuestionIndex];
            
            if (!qData.isMultiple) {
                checkSingleAnswer(index);
            } else {
                if (selectedAnswers.includes(index)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== index);
                    btnElement.classList.remove("selected");
                } else {
                    selectedAnswers.push(index);
                    btnElement.classList.add("selected");
                }
            }
        }

        function checkSingleAnswer(selectedIndex) {
            const qData = currentQuestions[currentQuestionIndex];
            const totalQ = currentQuestions.length;
            const buttons = document.querySelectorAll(".options-container .option-btn");
            buttons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            if (selectedIndex === qData.answer) {
                score++;
                buttons[selectedIndex].classList.add("correct");
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "Fantastic! That's correct! ✨";
                playAudio("sndCorrect");
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[qData.answer].classList.add("correct");
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `Oops! Incorrect. The correct answer is:<br><span style="color:#E91E63;">${qData.options[qData.answer]}</span>`;
                playAudio("sndWrong");
            }
            document.getElementById("scoreText").innerText = `Current Score: ${score} / ${totalQ}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function submitMultipleChoice() {
            const qData = currentQuestions[currentQuestionIndex];
            const totalQ = currentQuestions.length;
            const buttons = document.querySelectorAll(".options-container .option-btn");
            
            if(selectedAnswers.length === 0) {
                alert("Please select at least one option before submitting!");
                return;
            }

            document.getElementById("submitBtn").style.display = "none";
            buttons.forEach(btn => btn.disabled = true);

            selectedAnswers.sort((a, b) => a - b);
            const correctAnswers = [...qData.answer].sort((a, b) => a - b);
            const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);

            buttons.forEach((btn, idx) => {
                btn.classList.remove("selected");
                if (correctAnswers.includes(idx)) {
                    btn.classList.add("correct");
                } else if (selectedAnswers.includes(idx)) {
                    btn.classList.add("wrong");
                }
            });

            const feedback = document.getElementById("feedbackContainer");
            feedback.style.display = "block";

            const correctTexts = correctAnswers.map(idx => qData.options[idx]).join("<br>");

            if (isCorrect) {
                score++;
                feedback.className = "feedback-container feedback-success";
                feedback.innerHTML = "Fantastic! All correct! ✨";
                playAudio("sndCorrect");
            } else {
                feedback.className = "feedback-container feedback-fail";
                feedback.innerHTML = `Oops! Incorrect. The correct answer is:<br><span style="color:#E91E63; font-size:12pt;">${correctTexts}</span>`;
                playAudio("sndWrong");
            }

            document.getElementById("scoreText").innerText = `Current Score: ${score} / ${totalQ}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const totalQ = currentQuestions.length;
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("resultSection").style.display = "flex";
            document.getElementById("finalScoreText").innerText = score;

            let badge = "";
            const ratio = score / totalQ;
            if (score === totalQ) {
                badge = "Master Weeding Certification";
            } else if (ratio >= 0.7) {
                badge = "Level 5 Weeding Certificate";
            } else {
                badge = "Level 3 Weeding Certificate";
            }
            
            document.getElementById("badgeText").innerText = badge;
        }

        function restartGame() { initGame(); }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play blocked:", e));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
